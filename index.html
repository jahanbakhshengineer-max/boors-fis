<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحلیل بنیادی سهام</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3a5b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تحلیل بنیادی">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --navy:#1c3a5b;
  --navy-dark:#132a42;
  --tan:#c6a06a;
  --tan-dark:#a9824f;
  --teal:#3f8f86;
  --teal-dark:#2e6b64;
  --cream:#f7f4ee;
  --paper:#ffffff;
  --ink:#1f2937;
  --muted:#6b7280;
  --line:#e6e1d6;
  --good:#3f8f5f;
  --bad:#c0503f;
  --radius:10px;
  --shadow:0 1px 3px rgba(28,58,91,0.08), 0 1px 2px rgba(28,58,91,0.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0; overflow-x:hidden}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Vazirmatn','Tahoma',sans-serif;
  font-feature-settings:"tnum" 1;
  min-height:100vh;
  width:100%;
}
.app{display:flex; min-height:100vh; width:100%}
.sidebar{
  width:230px; flex:0 0 230px;
  background:linear-gradient(180deg,var(--navy),var(--navy-dark));
  color:#fff; padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  transition:transform .25s ease;
}
.brand{font-size:15px; font-weight:800; letter-spacing:.2px; margin-bottom:2px}
.brand small{display:block; font-size:11px; color:#c9d4de; font-weight:400; margin-top:3px}
.nav{margin-top:26px; display:flex; flex-direction:column; gap:4px}
.nav button{
  display:flex; align-items:center; gap:10px;
  background:transparent; border:none; color:#dbe4ec; text-align:right;
  padding:10px 12px; border-radius:8px; font-family:inherit; font-size:13.5px; cursor:pointer;
  transition:.15s;
}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:var(--tan); color:var(--navy-dark); font-weight:700}
.stock-picker{margin-top:24px; padding-top:18px; border-top:1px solid rgba(255,255,255,.15)}
.stock-picker label{font-size:11px; color:#aebccb; display:block; margin-bottom:6px}
.combo-list{position:absolute; top:calc(100% + 4px); right:0; left:0; background:#fff; border:1px solid #d8d2c4; border-radius:8px; max-height:240px; overflow-y:auto; z-index:200; display:none; box-shadow:0 6px 18px rgba(0,0,0,.18)}
.combo-list.open{display:block}
.combo-item{padding:8px 12px; cursor:pointer; font-size:13px; color:#1c1c1c; text-align:right}
.combo-item:hover, .combo-item.active{background:#f2ece0}
.combo-item.empty{color:#8a8a8a; cursor:default}
select, input, textarea{
  font-family:inherit; font-size:13.5px; border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; background:var(--paper); color:var(--ink); width:100%;
}
.sidebar select{background:rgba(255,255,255,.95); border:none}
main{flex:1; padding:26px 30px 60px; max-width:1400px; min-width:0}
.mobile-topbar{display:none}
.sidebar-backdrop{display:none}
/* ------- چیدمان موبایل ------- */
@media(max-width:860px){
  html,body{overflow-x:hidden}
  .app{display:block; width:100%}
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(180deg,var(--navy),var(--navy-dark)); color:#fff;
    padding:12px 16px; position:sticky; top:0; z-index:40;
  }
  .mobile-topbar .brand{font-size:14px; margin-bottom:0}
  .mobile-topbar .brand small{display:none}
  #hamburgerBtn{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:38px; height:38px;
    border-radius:8px; font-size:18px; cursor:pointer; flex:0 0 auto;
  }
  .sidebar{
    position:fixed !important; top:0; right:0; height:100vh; width:78vw; max-width:300px; z-index:60;
    transform:translateX(100%); visibility:hidden; box-shadow:-6px 0 24px rgba(0,0,0,.25);
  }
  .sidebar.open{transform:translateX(0); visibility:visible}
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(19,42,66,.5); z-index:50;
  }
  .sidebar-backdrop.open{display:block}
  main{padding:16px 14px 50px; max-width:100%; width:100%; display:block}
  h1.page-title{font-size:17px}
  .grid.cols-4, .grid.cols-3, .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr) !important}
  .card{padding:13px 14px}
  .kpi .value{font-size:18px}
  table{font-size:11.5px}
  .subtabs{overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch}
  .subtabs button{flex:0 0 auto; white-space:nowrap}
  .toolbar{flex-direction:column; align-items:stretch}
  .row{gap:8px}
  .modal{width:94vw; padding:18px 16px}
}
@media(max-width:480px){
  .grid.cols-4, .grid.cols-3, .grid.cols-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr !important}
  .chart-box{height:230px !important} /* نمودارهای ساده (تک/دو سری) */
  .chart-box.chart-md{height:260px !important} /* نمودارهای متوسط (چند سری یا لجند بزرگ) */
  .chart-box.chart-tall{height:320px !important} /* نمودارهای ترکیبی پیچیده (دو محور، چند سری، برچسب مقدار) */
}
h1.page-title{font-size:20px; margin:0 0 4px; font-weight:800; color:var(--navy)}
.page-sub{color:var(--muted); font-size:13px; margin-bottom:22px}
.grid{display:grid; gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr)} .grid.cols-3{grid-template-columns:repeat(2,1fr)}}
.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px;
}
.card h3{margin:0 0 12px; font-size:13.5px; color:var(--navy); font-weight:700; display:flex; align-items:center; justify-content:space-between}
.kpi{padding:14px 16px}
.kpi .label{font-size:11.5px; color:var(--muted); margin-bottom:6px}
.kpi .value{font-size:22px; font-weight:800; color:var(--navy); letter-spacing:.2px}
.kpi .value.small{font-size:17px}
.kpi .note{font-size:11px; color:var(--muted); margin-top:4px}
.pill{display:inline-block; font-size:10.5px; padding:2px 9px; border-radius:999px; background:var(--tan); color:var(--navy-dark); font-weight:700}
.pill.teal{background:var(--teal); color:#fff}
.section-title{font-size:15px; font-weight:800; color:var(--navy); margin:28px 0 12px; display:flex; align-items:center; gap:8px}
.section-title::before{content:""; width:5px; height:16px; background:var(--tan); border-radius:3px; display:inline-block}
.accordion-section{margin:22px 0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--paper)}
.accordion-header{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:linear-gradient(180deg,#fbf9f5,#f3efe6); border:none; cursor:pointer;
  padding:14px 18px; font-family:inherit; text-align:right;
}
.accordion-header .accordion-title{font-size:14.5px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:8px}
.accordion-header .accordion-title::before{content:""; width:5px; height:16px; background:var(--tan); border-radius:3px; display:inline-block}
.accordion-header .accordion-meta{font-size:11.5px; color:var(--muted); font-weight:400}
.accordion-chevron{font-size:13px; color:var(--navy); transition:transform .2s}
.accordion-header[data-open="false"] .accordion-chevron{transform:rotate(-90deg)}
.accordion-body{padding:16px 18px 18px; border-top:1px solid var(--line)}
table{width:100%; border-collapse:collapse; font-size:12.5px}
table th{background:var(--navy); color:#fff; padding:9px 8px; font-weight:600; white-space:nowrap; position:sticky; top:0}
table td{padding:8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap}
table tbody tr:nth-child(even){background:#faf8f4}
table tbody tr:hover{background:#f0ece1}
table tfoot td{background:var(--navy-dark); color:#fff; font-weight:700}
/* فریز ستون اول (نماد) هنگام اسکرول افقی — دقیقاً مثل «Freeze Panes» اکسل */
.table-wrap table th:first-child, .table-wrap table td:first-child{
  position:sticky; right:0; z-index:3; box-shadow:2px 0 4px rgba(0,0,0,.10);
}
.table-wrap table th:first-child{ z-index:6; background:var(--navy); }
.table-wrap table td:first-child{ background:#fff; }
.table-wrap table tbody tr:nth-child(even) td:first-child{ background:#faf8f4; }
.table-wrap table tbody tr:hover td:first-child{ background:#f0ece1; }
.table-wrap table tfoot td:first-child{ background:var(--navy-dark); }
.table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line)}
/* ردیف فیلتر ستونی زیر سرستون جدول‌ها (مثل فیلتر اکسل) */
table thead tr.col-filter-row th{position:sticky; top:34px; background:var(--paper); padding:4px 6px; z-index:5; box-shadow:0 1px 0 var(--line)}
.table-wrap table thead tr.col-filter-row th:first-child{z-index:7}
.col-filter-input{width:100%; min-width:64px; box-sizing:border-box; font-size:11px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; text-align:center; background:#fff; color:var(--navy-dark); font-family:inherit}
.col-filter-input:focus{outline:2px solid var(--teal); border-color:var(--teal)}
.col-filter-input::placeholder{color:var(--muted); font-size:10.5px}
.btn{
  background:var(--navy); color:#fff; border:none; border-radius:8px; padding:9px 16px;
  font-family:inherit; font-size:13px; cursor:pointer; font-weight:600; transition:.15s;
}
.btn:hover{background:var(--navy-dark)}
.btn.secondary{background:var(--paper); color:var(--navy); border:1px solid var(--navy)}
.btn.secondary:hover{background:#eef2f6}
.btn.tan{background:var(--tan); color:var(--navy-dark)}
.btn.tan:hover{background:var(--tan-dark); color:#fff}
.btn.danger{background:transparent; color:var(--bad); border:1px solid var(--bad)}
.btn.danger:hover{background:var(--bad); color:#fff}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.form-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media(max-width:1000px){.form-grid{grid-template-columns:repeat(2,1fr)}}
.field label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:5px}
.chart-box{position:relative; height:260px}
.tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.tag{font-size:11px; background:#eef2f6; color:var(--navy); padding:3px 9px; border-radius:999px; border:1px solid var(--line); cursor:pointer}
.tag.active{background:var(--navy); color:#fff}
.empty{padding:40px 20px; text-align:center; color:var(--muted)}
.empty b{color:var(--navy); display:block; font-size:15px; margin-bottom:6px}
.toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px}
.badge-industry{font-size:10.5px; background:var(--teal); color:#fff; padding:2px 8px; border-radius:6px; margin-right:6px}
.hint{font-size:11.5px; color:var(--muted); background:#f0ece1; border-radius:8px; padding:8px 12px; margin-top:10px; line-height:1.7}
.delete-row-btn{color:var(--bad); cursor:pointer; font-size:11px}
.modal-overlay{position:fixed; inset:0; background:rgba(19,42,66,.55); display:none; align-items:center; justify-content:center; z-index:50}
.modal-overlay.open{display:flex}
.modal{background:var(--paper); border-radius:14px; padding:22px 24px; width:420px; max-width:92vw; box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px; color:var(--navy)}
.modal .field{margin-bottom:12px}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy-dark); color:#fff; padding:10px 20px; border-radius:999px; font-size:13px; z-index:100; opacity:0; transition:.25s; pointer-events:none}
.toast.show{opacity:1}
.subtabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--line)}
.subtabs button{background:none; border:none; font-family:inherit; padding:9px 14px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent}
.subtabs button.active{color:var(--navy); border-bottom-color:var(--tan); font-weight:700}
.file-hidden{display:none}
/* ===== جابجایی با موس (Drag & Drop) ===== */
.drag-handle{cursor:grab; color:var(--muted); font-size:13px; padding:0 4px; user-select:none; line-height:1}
.drag-handle:active{cursor:grabbing}
[data-dragkey]{transition:opacity .15s}
[data-dragkey].dragging{opacity:.35; outline:2px dashed var(--tan)}
.nav [data-dragkey]{display:flex; align-items:center; gap:6px}
.nav [data-dragkey] .drag-handle{order:2; margin-right:auto}
.dash-widget{position:relative}
.dash-widget .drag-handle{position:absolute; top:2px; left:6px; z-index:2}
.accordion-header .drag-handle{margin-left:auto}
.clickable-row{cursor:pointer}
.clickable-row:hover{background:rgba(0,0,0,.035)}
/* سطر انتخاب‌شده توی جدول سبد سرمایه‌گذاری — پس‌زمینه پررنگ + قاب بالا/پایین تا گم نشه */
tr.selected-row td, .table-wrap table tr.selected-row td:first-child{
  background:var(--tan) !important; color:var(--navy-dark); font-weight:700;
  border-top:2px solid var(--navy); border-bottom:2px solid var(--navy);
}
tr.selected-row:hover td, .table-wrap table tr.selected-row:hover td:first-child{background:#e3cd9a !important}
</style>
</head>
<body>

<div class="mobile-topbar">
  <button id="hamburgerBtn" aria-label="منو">☰</button>
  <div class="brand">تحلیل بنیادی سهام<small>نسخه آزمایشی</small></div>
  <div style="width:38px"></div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app">
  <aside class="sidebar" id="sidebarEl">
    <div class="brand">تحلیل بنیادی سهام<small>نسخه آزمایشی — فاز اول (پالایش و مس)</small></div>
    <nav class="nav" id="navMenu"></nav>
    <button id="resetLayoutBtn" class="btn secondary" style="width:100%; font-size:11px; margin:2px 0 10px; padding:6px">↺ بازنشانی چیدمان</button>
    <div class="stock-picker">
      <label>سهم فعال <span style="font-weight:400; color:var(--muted); font-size:11px">(کلیک کن یا تایپ کن)</span></label>
      <div style="position:relative">
        <input id="activeStockSelect" placeholder="🔎 نماد یا نام سهم..." autocomplete="off">
        <div id="activeStockDropdown" class="combo-list"></div>
      </div>
    </div>
  </aside>
  <main id="mainContent"></main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" class="file-hidden" accept="application/json">

<script>
/* ========================= داده و ذخیره‌سازی ========================= */
const STORAGE_KEY = 'fundamental_analyzer_v1';
const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(str){ return String(str).replace(/[0-9]/g, d=>FA_DIGITS[d]); }
function fmt(n, decimals=0){
  if(n===null || n===undefined || isNaN(n)) return '—';
  const s = Number(n).toLocaleString('en-US', {maximumFractionDigits:decimals, minimumFractionDigits:decimals});
  return toFa(s);
}
// نمایش تاریخ/ساعت آخرین به‌روزرسانی (مثلاً ارزش بازار) به تقویم شمسی و اعداد فارسی
function formatUpdateTimestamp(ts){
  if(!ts) return null;
  try{
    return new Intl.DateTimeFormat('fa-IR', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}).format(new Date(ts));
  }catch(e){
    return new Date(ts).toLocaleString('fa-IR');
  }
}
function fmtPct(n, decimals=1){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return fmt(n*100, decimals) + '٪';
}
function uid(){ return Math.random().toString(36).slice(2,10); }

function defaultState(){
  return {
    industries: ['پالایش','مس'],
    stocks: {},
    goldFunds: {},
    goldMarket: {}
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed.stocks) return defaultState();
    return parsed;
  }catch(e){ console.error(e); return defaultState(); }
}
let state = loadState();
let activeSymbol = Object.keys(state.stocks)[0] || null;
let activeTab = 'dashboard';
let dashSubtab = 'overview';

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  syncToLinkedFile();
}

/* ========================= فایل محلی (ذخیره و فراخوانی خودکار روی دیسک) ========================= */
let linkedFileHandle = null;
let pendingReconnectHandle = null;
let linkedFileStatusMsg = '';
const LOCAL_FILE_DB_NAME = 'fundAnalyzerLocalFileDB';
const LOCAL_FILE_STORE = 'handles';
function supportsFileSystemAccess(){ return typeof window!=='undefined' && 'showSaveFilePicker' in window; }
function openHandleDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(LOCAL_FILE_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(LOCAL_FILE_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function saveHandleToDB(handle){
  const db = await openHandleDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(LOCAL_FILE_STORE,'readwrite');
    tx.objectStore(LOCAL_FILE_STORE).put(handle,'main');
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function loadHandleFromDB(){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(LOCAL_FILE_STORE,'readonly');
      const req = tx.objectStore(LOCAL_FILE_STORE).get('main');
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function writeStateToHandle(handle, st){
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(st, null, 1));
  await writable.close();
}
async function syncToLinkedFile(){
  if(!linkedFileHandle) return;
  try{ await writeStateToHandle(linkedFileHandle, state); }
  catch(err){ console.error('خطا در ذخیره‌ی خودکار در فایل محلی:', err); }
}
async function createLocalFile(){
  if(!supportsFileSystemAccess()) return showToast('این مرورگر از اتصال به فایل محلی پشتیبانی نمی‌کند — از Chrome یا Edge روی کامپیوتر استفاده کن');
  try{
    const handle = await window.showSaveFilePicker({suggestedName:'fundamental-analyzer-data.json', types:[{description:'JSON', accept:{'application/json':['.json']}}]});
    await writeStateToHandle(handle, state);
    linkedFileHandle = handle;
    pendingReconnectHandle = null;
    await saveHandleToDB(handle);
    showToast('فایل محلی ساخته شد و وصل شد: '+handle.name);
    renderAll();
  }catch(err){ if(err.name!=='AbortError') showToast('خطا: '+err.message); }
}
async function pickExistingLocalFile(){
  if(!supportsFileSystemAccess()) return showToast('این مرورگر از اتصال به فایل محلی پشتیبانی نمی‌کند — از Chrome یا Edge روی کامپیوتر استفاده کن');
  try{
    const [handle] = await window.showOpenFilePicker({types:[{description:'JSON', accept:{'application/json':['.json']}}]});
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !parsed.stocks) throw new Error('این فایل ساختار معتبری ندارد');
    state = parsed;
    activeSymbol = Object.keys(state.stocks)[0] || null;
    linkedFileHandle = handle;
    pendingReconnectHandle = null;
    await saveHandleToDB(handle);
    saveState();
    showToast('به فایل محلی وصل شد و اطلاعاتش بارگذاری شد: '+handle.name);
    renderAll();
  }catch(err){ if(err.name!=='AbortError') showToast('خطا: '+err.message); }
}
async function reconnectPendingLocalFile(){
  if(!pendingReconnectHandle) return;
  try{
    const perm = await pendingReconnectHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return showToast('اجازه‌ی دسترسی داده نشد');
    linkedFileHandle = pendingReconnectHandle;
    const file = await linkedFileHandle.getFile();
    const text = await file.text();
    if(text.trim()){
      const parsed = JSON.parse(text);
      if(parsed && parsed.stocks){ state = parsed; activeSymbol = Object.keys(state.stocks)[0] || activeSymbol; }
    }
    pendingReconnectHandle = null;
    saveState();
    showToast('دوباره به فایل محلی وصل شد: '+linkedFileHandle.name);
    renderAll();
  }catch(err){ showToast('خطا در اتصال مجدد: '+err.message); }
}
function unlinkLocalFile(){
  linkedFileHandle = null;
  pendingReconnectHandle = null;
  showToast('اتصال فایل محلی قطع شد (داده‌ها هنوز روی مرورگر ذخیره‌اند)');
  renderAll();
}
// موقع بالا آمدن برنامه، اگه قبلاً یک فایل محلی وصل شده بود، تلاش می‌کنه خودکار دوباره وصل شه
async function tryAutoReconnectLocalFile(){
  if(!supportsFileSystemAccess()) return;
  const handle = await loadHandleFromDB();
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      linkedFileHandle = handle;
      const file = await handle.getFile();
      const text = await file.text();
      if(text.trim()){
        const parsed = JSON.parse(text);
        if(parsed && parsed.stocks){ state = parsed; activeSymbol = Object.keys(state.stocks)[0] || null; }
      }
      renderAll();
    } else {
      pendingReconnectHandle = handle;
      renderAll();
    }
  }catch(e){ /* هندل نامعتبر شده (مثلاً فایل حذف شده)؛ نادیده می‌گیریم */ }
}
// رمزگذاری/رمزگشایی فایل پشتیبان با پسورد (AES-GCM + PBKDF2) — کاملاً سمت مرورگر، بدون سرور
async function deriveBackupKey(password, saltArr){
  const enc = new TextEncoder();
  const salt = new Uint8Array(saltArr);
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptBackupText(password, plainText){
  const saltArr = Array.from(crypto.getRandomValues(new Uint8Array(16)));
  const ivArr = Array.from(crypto.getRandomValues(new Uint8Array(12)));
  const key = await deriveBackupKey(password, saltArr);
  const cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv:new Uint8Array(ivArr)}, key, new TextEncoder().encode(plainText));
  return {encrypted:true, salt:saltArr, iv:ivArr, data:Array.from(new Uint8Array(cipherBuf))};
}
async function decryptBackupText(password, payload){
  const key = await deriveBackupKey(password, payload.salt);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:new Uint8Array(payload.iv)}, key, new Uint8Array(payload.data));
  return new TextDecoder().decode(plainBuf);
}
function showToast(msg){

function getFormulas(){
  if(!state.formulas || state.formulaSchemaVersion !== FORMULA_SCHEMA_VERSION){
    const customOnes = (state.formulas||[]).filter(f=>!f.builtin);
    state.formulas = [...DEFAULT_FORMULAS.map(f=>({...f})), ...customOnes];
    state.formulaSchemaVersion = FORMULA_SCHEMA_VERSION;
    saveState();
  }
  return state.formulas;
}
function getFormulaByKey(key){ return getFormulas().find(f=>f.key===key); }
// ارزیابی امن‌شده‌ی عبارت فرمول با متغیرهای مجاز (بدون دسترسی به اسکوپ بیرونی جز نام‌های داده‌شده)
function evalExpression(expr, context){
  if(!expr) return null;
  try{
    const keys = Object.keys(context);
    const vals = keys.map(k=> (context[k]===null || context[k]===undefined || isNaN(context[k])) ? NaN : Number(context[k]));
    const fn = new Function(...keys, 'return (' + expr + ');');
    const result = fn(...vals);
    if(typeof result !== 'number' || isNaN(result) || !isFinite(result)) return null;
    return result;
  }catch(e){ return null; }
}
function evalFormulaByKey(key, context){
  const def = getFormulaByKey(key);
  if(!def) return null;
  return evalExpression(def.expression, context);
}

/* ---- متغیرهای پایه (الگوریتمی، غیرقابل‌ویرایش از UI) ---- */
function sortPeriods(periods){
  return [...periods].sort((a,b)=> a.fiscalYear-b.fiscalYear || a.months-b.months);
}
function findPeriod(periods, fiscalYear, months){
  return periods.find(p=>p.fiscalYear===fiscalYear && p.months===months);
}
// TTM: هر دوره اول سراغ فیلدهای دستی «دوره مشابه سال قبل» و «آخرین سال مالی کامل» می‌ره؛
// اگه خالی بودن، خودش دنبال دوره‌ی واقعی ثبت‌شده در سابقه‌ی همین سهم می‌گرده (fiscalYear-1) و از اونجا مقدار رو برمی‌داره.
// ویژه‌ی دوره ۱۲ماهه: میانگین امسال و سال قبل. اگه داده‌ی سال قبل نبود: همون آخرین مقدار وارد شده (بدون تعدیل)
function ttmFlowSelfContained(periods, target, field){
  const current = target[field];
  if(current==null) return null;
  const priorYearPeriod = (months)=> findPeriod(periods, target.fiscalYear-1, months);
  if(target.months===12){
    const lastFullYear = target[field+'LastFullYear'] ?? priorYearPeriod(12)?.[field] ?? null;
    return lastFullYear!=null ? (current+lastFullYear)/2 : current;
  }
  const samePrior = target[field+'SamePriorPeriod'] ?? priorYearPeriod(target.months)?.[field] ?? null;
  const lastFullYear = target[field+'LastFullYear'] ?? priorYearPeriod(12)?.[field] ?? null;
  if(lastFullYear!=null && samePrior!=null) return lastFullYear - samePrior + current;
  return current;
}
function discreteQuarter(periods, target, field){
  if(target[field]==null) return null;
  if(target.months===3) return target[field];
  const prev = findPeriod(periods, target.fiscalYear, target.months-3);
  if(prev && prev[field]!=null) return target[field] - prev[field];
  // دوره‌ی ماقبل (فصل قبلی همون سال مالی) هنوز ثبت نشده — به‌جای null (که نسبت‌های وابسته رو تا ثبت همه‌ی دوره‌ها خالی نگه می‌داشت)،
  // مقدار تجمیعی خودِ همین دوره‌ی واردشده رو بدون تعدیل به‌عنوان بهترین برآورد موجود برمی‌گردونیم (هم‌راستا با رفتار ttmFlowSelfContained)
  return target[field];
}
// TTM سود خالص = جمع سود خالص فصلیِ گسسته (محاسبه‌شده با تفریق از دوره تجمیعی قبل) برای ۴ دورهٔ اخیر به ترتیب زمانی
function ttmNetIncomeSelfContained(periods, target){
  const sorted = sortPeriods(periods);
  const idx = sorted.findIndex(p=>p.fiscalYear===target.fiscalYear && p.months===target.months);
  if(idx===-1) return discreteQuarter(sorted, target, 'netIncomeQ');
  const last4 = sorted.slice(Math.max(0,idx-3), idx+1);
  const vals = last4.map(p=>discreteQuarter(sorted, p, 'netIncomeQ')).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0);
}
// میانگین موجودی/مطالبات = میانگین با مانده‌ی پایان سال مالی قبل (نه دوره مشابه سال قبل) — مطابق روش تأییدشده کاربر
function avgBalance(periods, target, field){
  const prevYearEnd = findPeriod(periods, target.fiscalYear-1, 12);
  if(prevYearEnd && prevYearEnd[field]!=null && target[field]!=null) return (target[field] + prevYearEnd[field]) / 2;
  return target[field];
}
// زمینه‌ی پایه (بدون فیلدهای برآوردی) — برای جلوگیری از حلقه‌ی بازگشتی در محاسبه‌ی حاشیه‌سود
function buildBaseContext(stock, periods, target){
  const manual = stock.manual || {};
  const jRaw = discreteQuarter(periods, target, 'otherIncomeQ');
  const kRaw = discreteQuarter(periods, target, 'otherNonOperatingQ');
  return {
    S: target.sales, C: target.cogs,
    I: target.inventory, R: target.receivables,
    A: target.totalAssets, E: target.equity,
    G: target.currentAssets, P: target.prepaid, L: target.currentLiabilities,
    s: ttmFlowSelfContained(periods, target, 'sales'),
    c: ttmFlowSelfContained(periods, target, 'cogs'),
    n: ttmNetIncomeSelfContained(periods, target),
    i: avgBalance(periods, target, 'inventory'),
    r: avgBalance(periods, target, 'receivables'),
    q: discreteQuarter(periods, target, 'sales'),
    // سود خالص در حال تداوم / سایر درآمدها / سایر درآمد غیرعملیاتی حالا «تجمیعی از ابتدای سال مالی» وارد می‌شن
    // و مقدار فصلی (سه‌ماهه گسسته) با تفریق از دوره تجمیعی قبل همان سال مالی محاسبه می‌شه (دقیقاً مثل فروش/بهای‌تمام‌شده)
    // اگه سایر درآمدها یا سایر درآمد غیرعملیاتی این فصل منفی بود، توی محاسبه سود خالص/حاشیه سود لحاظ نمی‌شه (صفر در نظر گرفته می‌شه)
    p: discreteQuarter(periods, target, 'netIncomeQ'),
    j: jRaw!=null && jRaw<0 ? 0 : jRaw,
    k: kRaw!=null && kRaw<0 ? 0 : kRaw,
    K: manual.marketCap!=null? Number(manual.marketCap): null,
    V: manual.dividendIncome!=null? Number(manual.dividendIncome): null,
    B: manual.bankInterest!=null? Number(manual.bankInterest): null,
    o: manual.otherOperatingIncome!=null? Number(manual.otherOperatingIncome): null,
    w: manual.otherNonOperatingIncome!=null? Number(manual.otherNonOperatingIncome): null,
  };
}
// زمینه‌ی کامل (شامل فیلدهای برآوردی سطح‌سهم) — برای نمایش KPI و ستون‌های جدول
function buildContext(stock, periods, target){
  return Object.assign({}, buildBaseContext(stock, periods, target), {
    F: estimateAnnualSales(stock),
    M: estimateLatestMargin(stock),
    H: estimateNetIncomeAddons(stock),
    D: estimateAvgDividendPayout(stock),
  });
}
// محاسبه‌ی همه‌ی فرمول‌های ثبت‌شده (پیش‌فرض + دلخواه کاربر) برای یک دوره‌ی خاص
function computeAllFormulas(stock, periods, target){
  const ctx = buildContext(stock, periods, target);
  const out = {};
  getFormulas().forEach(f=>{ out[f.key] = evalExpression(f.expression, ctx); });
  return out;
}
// نگه‌داشته‌شده برای سازگاری با نمودارهای روند (همون خروجی‌های پایه + فرمول‌های محاسبه‌شده)
function computeMetricsForPeriod(stock, target){
  const periods = stock.periods || [];
  const ctx = buildContext(stock, periods, target);
  const formulas = computeAllFormulas(stock, periods, target);
  return Object.assign({}, ctx, formulas);
}
function latestPeriod(stock){
  const sorted = sortPeriods(stock.periods||[]);
  return sorted.length ? sorted[sorted.length-1] : null;
}
// تبدیل تاریخ میلادی سیستم به شمسی (الگوریتم استاندارد جلالی) — فقط برای تشخیص «امروز چه ماهی از سال مالیه»، جای دیگه‌ای استفاده نمی‌شه
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ jy += Math.floor((days-1)/365); days = (days-1)%365; }
  let jm, jd;
  if(days < 186){ jm = 1 + Math.floor(days/31); jd = 1 + (days%31); }
  else { jm = 7 + Math.floor((days-186)/30); jd = 1 + ((days-186)%30); }
  return {jy, jm, jd};
}
function getTodayJalali(){
  const now = new Date();
  const {jy, jm, jd} = gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return {year: jy, month: jm, day: jd};
}
// تبدیل تاریخ شمسی تقویمی (سال، ماه) به سال مالی و «ماه چندم از سال مالی» بر اساس ماه پایان سال مالی این سهم
// مثال: اگه پایان سال مالی شهریور(۶) باشه، مهر همون سال شمسی = ماه ۱ سال مالی بعدی
function calendarToFiscalMonth(calYear, calMonth, endMonth){
  endMonth = endMonth || 12;
  if(endMonth===12) return {fiscalYear: calYear, monthInFY: calMonth};
  if(calMonth > endMonth) return {fiscalYear: calYear+1, monthInFY: calMonth-endMonth};
  return {fiscalYear: calYear, monthInFY: calMonth + (12-endMonth)};
}
function stockFYEndMonth(stock){ return stock.fiscalYearEndMonth || 12; }
// همه‌ی ورودی‌های فروش ماهانه (که با کلید تقویمی ذخیره شدن) رو به فرمت سال‌مالی/ماه‌ام‌سال‌مالی تبدیل می‌کنه
function getMonthlySalesFiscalEntries(stock){
  const endM = stockFYEndMonth(stock);
  return Object.entries(stock.monthlySales||{}).map(([k,v])=>{
    const [cy,cm] = k.split('-').map(Number);
    const {fiscalYear, monthInFY} = calendarToFiscalMonth(cy,cm,endM);
    return {key:k, calYear:cy, calMonth:cm, fiscalYear, monthInFY, value:v};
  });
}
function currentFiscalYearForSales(stock){
  const entries = getMonthlySalesFiscalEntries(stock);
  if(!entries.length) return null;
  return Math.max(...entries.map(e=>e.fiscalYear));
}
// شمارش تعداد ماه‌های پیوسته‌ی وارد‌شده‌ی فروش ماهانه از ماه ۱ سال مالی، بدون هیچ جای خالی — تا سقف «امروز» (تا از ماه‌های آینده اشتباهی حساب نشه)
function countContiguousMonthlyEntries(stock, fiscalYear, capMonthInFY){
  const entries = getMonthlySalesFiscalEntries(stock).filter(e=>e.fiscalYear===fiscalYear && e.value!=null && e.value!=='');
  const monthSet = new Set(entries.map(e=>e.monthInFY));
  let count = 0;
  for(let m=1; m<=12; m++){
    if(capMonthInFY!=null && m>capMonthInFY) break;
    if(monthSet.has(m)) count++;
    else break; // به محض برخورد به یه ماه خالی، شمارش متوقف می‌شه (چون دیگه «پیوسته» نیست)
  }
  return count;
}
// برآورد فروش سالانه — استراتژی:
// اگه تعداد ماه‌های فروش ماهانه‌ی پیوسته (بدون جای خالی) ثبت‌شده برای سال مالی جاری از تعداد ماه‌های آخرین دوره‌ی
// صورت سود و زیان ثبت‌شده (برای همون سال مالی) بیشتر باشه، یعنی داده‌ی ماهانه دقیق‌تر و به‌روزتره — پس مبنا قرار می‌گیره
// (حتی اگه خودش هم صد‌درصد تا امروز کامل نباشه). در غیر این صورت، از فرمول قبلی مبتنی بر دوره‌ی مالی استفاده می‌شه.
// برآورد فروش سالانه: همیشه از ضرب «میانگین فروش ماهانه» در ۱۲ به دست میاد — نه از فروش دوره‌ی صورت سود و زیان.
// اولویت با آخرین YTD ثبت‌شده (از گزارش فعالیت ماهانه خام کدال) برای سال مالی جاریه، چون همیشه به‌روزترین و کامل‌ترین
// عدد تجمیعیِ گزارش‌شده‌ست — حتی اگه ماه‌به‌ماه هم به‌طور کامل وارد شده باشه. فقط اگه YTD ای ثبت نشده، از میانگین
// همون ماه‌های به‌صورت جداگانه واردشده استفاده می‌شه. اگه هیچ‌کدوم نبود، برآوردی وجود نداره (دیگه به فروش دوره‌ی پی‌ان‌ال برنمی‌گردیم).
function estimateAnnualSales(stock){
  if(stock.manual && stock.manual.estimatedAnnualSalesOverride) return stock.manual.estimatedAnnualSalesOverride;
  // نکته‌ی مهم: اینجا از currentFiscalYearForSales (سال مالیِ آخرین داده‌ی واقعاً ثبت‌شده) استفاده می‌کنیم،
  // نه از سال مالیِ «امروزِ واقعیِ تقویم». این باعث می‌شه دقیقاً با همون سال مالی‌ای هماهنگ باشه که تب «فروش ماهانه»
  // (computeSalesVsAverage/computeSalesGrowthCum) براش میانگین/تجمیعی نشون می‌ده — وگرنه اگه سال مالی تازه شروع شده
  // باشه ولی هنوز گزارشی براش پیست نشده، این تابع دنبال داده‌ی سال مالیِ خالی می‌گشت و «—» برمی‌گردوند، در حالی‌که
  // تب فروش ماهانه همچنان میانگینِ (درست) سال مالیِ قبلی رو نشون می‌داد.
  const fy = currentFiscalYearForSales(stock);
  if(fy==null) return null;
  const ytd = (stock.monthlySalesYTD||{})[fy];
  if(ytd && ytd.currentYTD!=null && ytd.throughMonth>0){
    return (ytd.currentYTD/ytd.throughMonth)*12;
  }
  const entries = getMonthlySalesFiscalEntries(stock).filter(e=>e.fiscalYear===fy && e.value!=null && e.value!=='');
  if(!entries.length) return null;
  const avg = entries.reduce((s,e)=> s + (Number(e.value)||0), 0) / entries.length;
  return avg*12;
}
// حاشیه سود فصلی یک دوره‌ی مشخص (با همون فرمول qMargin) — تابع کمکی برای استفاده در چند دوره
function computeQuarterMarginForPeriod(stock, periods, period){
  if(!period) return null;
  const ctx = buildBaseContext(stock, periods, period);
  return evalFormulaByKey('qMargin', ctx);
}
// میانگین ساده‌ی حاشیه سود ۴ فصل اخیر (جمع ۴ حاشیه‌ی فصلی تقسیم بر تعداد فصل‌های موجود، حداکثر ۴) — برای حالتی که
// کاربر از تنظیمات سهم «محاسبه حاشیه سود بر اساس میانگین TTM» رو روشن کرده باشه (stock.useTTMMargin)
function computeTTMAverageMargin(stock){
  const periods = stock.periods || [];
  const sorted = sortPeriods(periods);
  const last4 = sorted.slice(-4);
  const vals = last4.map(p=> computeQuarterMarginForPeriod(stock, periods, p)).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
// آخرین حاشیه سود به‌دست‌آمده (فصل اخیر) - نه میانگین چند فصل
// استثنا ۱: اگه کاربر برای این سهم «محاسبه بر اساس میانگین TTM» رو روشن کرده باشه (stock.useTTMMargin)، به‌جای منطق زیر
// همیشه میانگین ساده‌ی ۴ فصل اخیر برگردونده می‌شه — صرف‌نظر از منفی یا مثبت بودن فصل اخیر.
// استثنا ۲: اگه حاشیه سود فصل اخیر منفی بشه (و حالت TTM روشن نباشه)، به‌جاش میانگین سه عدد زیر رو برای برآورد سود برمی‌گردونیم:
// حاشیه سود دو دوره‌ی قبل (دوره‌ی ماقبل آخر و دوره‌ی قبل از اون) + حاشیه سود دوره‌ی مشابه سال قبل — جمع سه عدد تقسیم بر سه
// (اگه حتی یکی از این سه دوره در سابقه‌ی سهم ثبت نشده/محاسبه‌پذیر نباشه، میانگین‌گیری انجام نمی‌شه و همون حاشیه سود خام فصل اخیر برگردونده می‌شه)
function estimateLatestMargin(stock){
  const lp = latestPeriod(stock);
  if(!lp) return null;
  const periods = stock.periods || [];
  if(stock.useTTMMargin) return computeTTMAverageMargin(stock);
  const margin = computeQuarterMarginForPeriod(stock, periods, lp);
  if(margin!=null && margin<0){
    const sorted = sortPeriods(periods);
    const idx = sorted.findIndex(p=>p.fiscalYear===lp.fiscalYear && p.months===lp.months);
    const prev1 = idx>0 ? sorted[idx-1] : null;
    const prev2 = idx>1 ? sorted[idx-2] : null;
    const samePriorYear = findPeriod(periods, lp.fiscalYear-1, lp.months);
    const fallbackVals = [prev1, prev2, samePriorYear]
      .map(p=> computeQuarterMarginForPeriod(stock, periods, p));
    // فقط وقتی هر سه دوره در دسترس و محاسبه‌پذیر باشن میانگین می‌گیریم؛ وگرنه همون margin خام (آخرین دوره) رو نگه می‌داریم
    if(fallbackVals.every(v=>v!=null)) return fallbackVals.reduce((a,b)=>a+b,0)/3;
  }
  return margin;
}
function estimateNetIncomeByMargin(stock){
  const sales = estimateAnnualSales(stock);
  const margin = estimateLatestMargin(stock);
  if(sales==null || margin==null) return null;
  return sales*margin;
}
// جمع سودهای تکرارشونده/غیرمرتبط با عملیات اصلی که دستی وارد شدن (سود سهام، بانکی، سایر عملیاتی)
function estimateNetIncomeAddons(stock){
  const m = stock.manual || {};
  const vals = [m.dividendIncome, m.bankInterest, m.otherOperatingIncome, m.otherNonOperatingIncome].filter(v=>v!=null && v!=='');
  if(!vals.length) return 0;
  return vals.reduce((s,v)=> s+Number(v), 0);
}
// برآورد نهایی سود خالص انتهای دوره = (حاشیه سود × برآورد فروش) + جمع سودهای تکرارشونده دستی
function estimateFinalNetIncome(stock){
  const byMargin = estimateNetIncomeByMargin(stock);
  const addons = estimateNetIncomeAddons(stock);
  if(byMargin==null) return null;
  return byMargin + addons;
}
// درصد تقسیم سود هر سال = سود سهام مصوب تقسیمی ÷ سود سهام پایان دوره همون سال (هر دو به‌عنوان عدد خام وارد می‌شن، نه درصد)
function dividendPayoutPercent(h){
  if(h==null || h.dividendApproved==null || h.profitEndOfPeriod==null || h.profitEndOfPeriod===0) return null;
  return Math.abs((h.dividendApproved / h.profitEndOfPeriod) * 100);
}
// میانگین درصد تقسیم سود ۴ سال اخیر (از جدول «سود تقسیمی سالانه» در تب ورود اطلاعات) — به‌صورت اعشاری (۰.۷ برای ۷۰٪)
function estimateAvgDividendPayout(stock){
  const hist = (stock.dividendHistory||[]).slice().sort((a,b)=>a.fiscalYear-b.fiscalYear);
  const withPct = hist.map(h=>dividendPayoutPercent(h)).filter(v=>v!=null);
  const last = withPct.slice(-4);
  if(!last.length) return null;
  const sum = last.reduce((s,v)=> s+v, 0);
  return (sum/last.length)/100;
}
// رشد فروش تجمیعی: مقایسه‌ی جمع فروش از ابتدای سال مالی تا آخرین ماه ثبت‌شده، با همون بازه از سال قبل (این یک روش مقایسه‌ایه، نه یک فرمول جبری تک‌خطی)
// اگه ماه‌به‌ماه به‌طور کامل/پیوسته ثبت نشده باشه ولی داده‌ی YTD (از گزارش فعالیت ماهانه خام کدال) با پوشش بیشتر یا مساوی موجود باشه،
// به‌جای جمع‌زدن ماه‌به‌ماه (که با جاافتادگی، جمع رو دست‌کم نشون می‌داد)، مستقیماً از اون عدد تجمیعیِ گزارش‌شده استفاده می‌کنیم.
// رشد فروش تجمیعی: همیشه بر اساس آخرین گزارش ماهانه‌ای که هم YTD سال جاری و هم سال قبل رو داره محاسبه می‌شه —
// حتی اگه ماه‌به‌ماه هم به‌طور کامل ثبت شده باشه، چون YTD گزارش همیشه به‌روزترین/دقیق‌ترین عدد تجمیعیه.
// فقط وقتی هیچ YTD ای ثبت نشده، از جمع‌زدن دستیِ ماه‌به‌ماه استفاده می‌شه.
function computeSalesGrowthCum(stock){
  const fy = currentFiscalYearForSales(stock);
  const ytd = (stock.monthlySalesYTD||{})[fy];
  if(ytd && ytd.currentYTD!=null){
    return {
      curSum: ytd.currentYTD,
      priorSum: ytd.priorYearYTD ?? null,
      growth: (ytd.priorYearYTD!=null && ytd.priorYearYTD>0) ? (ytd.currentYTD-ytd.priorYearYTD)/ytd.priorYearYTD : null,
      months: ytd.throughMonth, fy, priorComplete: ytd.priorYearYTD!=null, usedYTD: true
    };
  }
  const entries0 = fy!=null ? getMonthlySalesFiscalEntries(stock).filter(e=>e.fiscalYear===fy) : [];
  if(!fy || !entries0.length) return null;
  const maxMonth = Math.max(...entries0.map(e=>e.monthInFY));
  const curMap = {}; entries0.forEach(e=>curMap[e.monthInFY]=e.value);
  const priorMap = {}; getMonthlySalesFiscalEntries(stock).filter(e=>e.fiscalYear===fy-1).forEach(e=>priorMap[e.monthInFY]=e.value);
  let curSum=0, priorSum=0, priorMonthsCovered=0;
  for(let m=1;m<=maxMonth;m++){
    if(curMap[m]!=null) curSum += Number(curMap[m]);
    if(priorMap[m]!=null){ priorSum += Number(priorMap[m]); priorMonthsCovered++; }
  }
  const priorComplete = priorMonthsCovered === maxMonth; // برای جلوگیری از مقایسه‌ی نادرست، فقط وقتی همه‌ی ماه‌های سال قبل هم ثبت شده باشن درصد رشد محاسبه می‌شه
  const growth = (priorComplete && priorSum>0) ? (curSum-priorSum)/priorSum : null;
  return {curSum, priorSum: priorMonthsCovered>0?priorSum:null, growth, months:maxMonth, fy, priorComplete, usedYTD:false};
}
// فروش نقطه‌به‌نقطه: فروش آخرین ماه ثبت‌شده در مقابل همون ماه در سال قبل
function computePointToPointSales(stock){
  const fy = currentFiscalYearForSales(stock);
  if(!fy) return null;
  const entries = getMonthlySalesFiscalEntries(stock);
  const curEntries = entries.filter(e=>e.fiscalYear===fy);
  if(!curEntries.length) return null;
  const month = Math.max(...curEntries.map(e=>e.monthInFY));
  const curVal = curEntries.find(e=>e.monthInFY===month)?.value;
  const priorEntry = entries.find(e=>e.fiscalYear===fy-1 && e.monthInFY===month);
  const priorVal = priorEntry ? priorEntry.value : null;
  const growth = (priorVal!=null && priorVal!==0) ? (curVal-priorVal)/priorVal : null;
  return {curVal, priorVal: priorVal ?? null, growth, month, fy};
}
// فروش نسبت به میانگین: فروش آخرین ماه در مقابل میانگین همه‌ی ماه‌های ثبت‌شده‌ی همین سال مالی (شامل خودش)
// اگه ماه‌به‌ماه ناقص باشه ولی داده‌ی YTD با پوشش بیشتر/مساوی موجود باشه، میانگین رو از روی YTD (تقسیم بر تعداد ماه واقعی) می‌گیریم.
// فروش نسبت به میانگین: میانگین همیشه از «فروش تجمعی به‌روز» (آخرین YTD ثبت‌شده) به دست میاد — حتی اگه ماه‌به‌ماه هم کامل باشه.
// فقط وقتی YTD ای ثبت نشده، از میانگین ماه‌های جداگانه‌ی واردشده استفاده می‌شه.
function computeSalesVsAverage(stock){
  const fy = currentFiscalYearForSales(stock);
  const ytd = (stock.monthlySalesYTD||{})[fy];
  const entries = fy!=null ? getMonthlySalesFiscalEntries(stock).filter(e=>e.fiscalYear===fy) : [];
  if(ytd && ytd.currentYTD!=null && ytd.throughMonth>0){
    const avgSoFar = ytd.currentYTD/ytd.throughMonth;
    const monthlyMaxMonth = entries.length ? Math.max(...entries.map(e=>e.monthInFY)) : 0;
    // آخرین مقدار تک‌ماهه (اگه ثبت شده باشه) رو برای مقایسه‌ی «این ماه در مقابل میانگین» نگه می‌داریم؛ وگرنه از خودِ میانگین به‌عنوان تنها نقطه‌ی داده استفاده می‌شه
    const curVal = monthlyMaxMonth>=ytd.throughMonth ? entries.find(e=>e.monthInFY===monthlyMaxMonth)?.value : avgSoFar;
    const growth = avgSoFar ? (curVal-avgSoFar)/avgSoFar : null;
    return {curVal, avgSoFar, growth, month: Math.max(monthlyMaxMonth, ytd.throughMonth), fy, monthsCount: ytd.throughMonth, usedYTD:true};
  }
  if(!fy || !entries.length) return null;
  const month = Math.max(...entries.map(e=>e.monthInFY));
  const curVal = entries.find(e=>e.monthInFY===month)?.value;
  const avgSoFar = entries.reduce((s,e)=> s + (Number(e.value)||0), 0) / entries.length;
  const growth = avgSoFar ? (curVal-avgSoFar)/avgSoFar : null;
  return {curVal, avgSoFar, growth, month, fy, monthsCount: entries.length, usedYTD:false};
}
// نسبت صادراتی = فروش صادراتی ÷ فروش کل (داخلی + صادراتی)، بر اساس ماه‌های سال مالی جاری که فروش داخلی/صادراتی برایشان ثبت شده
function computeExportRatio(stock){
  const split = stock.monthlySalesSplit || {};
  const fy = currentFiscalYearForSales(stock);
  if(!fy) return null;
  const endM = stockFYEndMonth(stock);
  const keys = Object.keys(split).filter(k=>{
    const [cy,cm] = k.split('-').map(Number);
    return calendarToFiscalMonth(cy,cm,endM).fiscalYear === fy;
  });
  if(!keys.length) return null;
  let domesticSum=0, exportSum=0;
  keys.forEach(k=>{ domesticSum += Number(split[k].domestic)||0; exportSum += Number(split[k].export)||0; });
  const total = domesticSum+exportSum;
  if(!total) return null;
  return {ratio: exportSum/total, domesticSum, exportSum, months: keys.length, fy};
}
function peF(stock){ const lp=latestPeriod(stock); if(!lp) return null; return evalFormulaByKey('peF', buildContext(stock, stock.periods, lp)); }
// برای سهم‌های هلدینگ/شرکت سرمایه‌گذاری: چون خودِ هلدینگ صورت سود و زیان عملیاتی معناداری نداره،
// همه‌ی نسبت‌های مالی داشبوردش از میانگین وزنی (بر اساس درصد مالکیت) نسبت‌های همون زیرمجموعه‌های بورسی‌اش محاسبه می‌شه
const HOLDING_WEIGHTED_KEYS = ['peF','pdRatio','psRatio','paRatio','pbRatio','qMargin','receivablesRatio','quickRatio','roa','roe','roeDupont','inventoryDays','receivableDays'];
function computeHoldingWeightedMetrics(stock){
  const subs = (stock.subsidiaries || []).filter(sub=>state.stocks[sub.symbol]);
  const result = {};
  if(!subs.length) return result;
  HOLDING_WEIGHTED_KEYS.forEach(key=>{
    let weightedSum = 0, weightUsed = 0;
    subs.forEach(sub=>{
      const subStock = state.stocks[sub.symbol];
      const lp = latestPeriod(subStock);
      if(!lp) return;
      const val = key==='peF' ? peF(subStock) : computeMetricsForPeriod(subStock, lp)[key];
      if(val==null || !isFinite(val)) return;
      weightedSum += val * sub.percent;
      weightUsed += sub.percent;
    });
    result[key] = weightUsed>0 ? weightedSum/weightUsed : null;
  });
  return result;
}
function pdRatio(stock){ const lp=latestPeriod(stock); if(!lp) return null; return evalFormulaByKey('pdRatio', buildContext(stock, stock.periods, lp)); }
function psRatio(stock){ const lp=latestPeriod(stock); if(!lp) return null; return evalFormulaByKey('psRatio', buildContext(stock, stock.periods, lp)); }
function paRatio(stock){ const lp=latestPeriod(stock); if(!lp) return null; return evalFormulaByKey('paRatio', buildContext(stock, stock.periods, lp)); }
function pbRatio(stock){ const lp=latestPeriod(stock); if(!lp) return null; return evalFormulaByKey('pbRatio', buildContext(stock, stock.periods, lp)); }
function formatByDef(def, value){
  if(value==null) return '—';
  if(def.format==='percent') return fmtPct(value, def.decimals ?? 1);
  if(def.format==='ratio') return fmt(value, def.decimals ?? 1);
  return fmt(value, def.decimals ?? 0) + (def.unit||'');
}

/* ========================= چیدمان قابل جابجایی (Drag & Drop) =========================
   کاربر می‌تونه ترتیب منوی کناری، کارت‌های داشبورد، و بخش‌های اکاردئونی تب «ورود اطلاعات» رو
   با موس جابجا کنه. ترتیب دلخواه در state.layout ذخیره و با بقیه‌ی state پرسیست می‌شه. */
function ensureLayoutState(){
  if(!state.layout) state.layout = {};
  return state.layout;
}
// آرایه‌ی «ترتیب پیش‌فرض» رو با ترتیب ذخیره‌شده‌ی کاربر ترکیب می‌کنه:
// کلیدهای جدیدی که کاربر قبلاً ندیده (مثلاً بعد از آپدیت برنامه) به انتهای لیست اضافه می‌شن،
// کلیدهای منسوخ‌شده (که دیگه در defaultKeys نیستن) از ترتیب ذخیره‌شده حذف می‌شن.
function applySavedOrder(defaultKeys, savedOrder){
  if(!Array.isArray(savedOrder) || !savedOrder.length) return defaultKeys.slice();
  const known = new Set(defaultKeys);
  const ordered = savedOrder.filter(k=>known.has(k));
  defaultKeys.forEach(k=>{ if(!ordered.includes(k)) ordered.push(k); });
  return ordered;
}
// فعال‌سازی جابجایی با موس روی مجموعه‌ای از عناصر هم‌سطح داخل یک container.
// هر آیتم باید attribute «data-dragkey» یکتا داشته باشه. بعد از رها شدن، onReorder(newKeyOrderArray) صدا زده می‌شه.
function enableDragReorder(container, itemSelector, onReorder){
  if(!container) return;
  container.querySelectorAll(itemSelector).forEach(item=>{
    item.setAttribute('draggable','true');
    item.addEventListener('dragstart', e=>{
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', item.dataset.dragkey||''); }catch(err){}
    });
    item.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      const order = Array.from(container.querySelectorAll(itemSelector)).map(el=>el.dataset.dragkey);
      onReorder(order);
    });
    item.addEventListener('dragover', e=>{
      e.preventDefault();
      const dragging = container.querySelector(itemSelector+'.dragging');
      if(!dragging || dragging===item) return;
      const box = item.getBoundingClientRect();
      // اگه عنصر پهن‌تر از بلندیشه (کنار هم قرار می‌گیرن)، مبنا محور افقیه؛ وگرنه عمودی
      const horizontal = box.width > box.height;
      const after = horizontal ? (e.clientX > box.left + box.width/2) : (e.clientY > box.top + box.height/2);
      item.parentNode.insertBefore(dragging, after ? item.nextSibling : item);
    });
  });
}

// گیج نیم‌دایره‌ای (شبیه تاکومتر) برای نمایش نسبت‌های درصدی در نمای کلی — pct بین ۰ تا ۱۰۰
// گیج نیم‌دایره‌ای (شبیه تاکومتر) برای نمایش نسبت‌ها در نمای کلی
// opts.maxScale: مقداری که انتهای قوس (۱۰۰٪ موقعیت) رو نشون می‌ده — مثلاً میانگین صنعت
// opts.reverse: اگه true باشه، رنگ‌ها برعکس می‌شه (پایین=سبز، بالا=قرمز) — برای نسبت‌هایی که کمترشون بهتره
// opts.suffix: پسوند نمایش عدد (پیش‌فرض ٪)، opts.decimals: تعداد رقم اعشار نمایش
function renderGaugeSVG(value, label, opts={}){
  const minScale = opts.minScale!=null ? opts.minScale : 0; // پیش‌فرض صفر، دقیقاً مثل قبل — برای گیج‌های رشد/افت می‌شه منفی هم گذاشت
  const maxScale = (opts.maxScale!=null && opts.maxScale>0) ? opts.maxScale : 100;
  const reverse = !!opts.reverse;
  const suffix = opts.suffix!=null ? opts.suffix : '٪';
  const has = value!=null && !isNaN(value);
  const rawClamped = has ? Math.max(minScale, value) : 0;
  const posPct = has ? Math.max(0, Math.min(100, ((rawClamped-minScale)/(maxScale-minScale))*100)) : 0; // موقعیت روی قوس (۰ تا ۱۰۰)
  const cx=100, cy=98, r=76;
  function pt(p, rad){ const a = (180 - (p/100)*180) * Math.PI/180; return [cx + rad*Math.cos(a), cy - rad*Math.sin(a)]; }
  function arcPath(p0, p1, rad){
    const [x0,y0] = pt(p0, rad), [x1,y1] = pt(p1, rad);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${rad} ${rad} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  const [nx, ny] = pt(posPct, r*0.78);
  const decimals = opts.decimals!=null ? opts.decimals : (Math.abs(rawClamped) < 10 ? 1 : 0);
  const displayText = has ? toFa(rawClamped.toFixed(decimals)) + suffix : '—';
  const colorLow = reverse ? '#3f8f86' : '#c0503f';
  const colorHigh = reverse ? '#c0503f' : '#3f8f86';
  return `
  <div style="text-align:center">
    <svg viewBox="0 0 200 150" style="width:100%; max-width:170px; display:block; margin:0 auto; overflow:visible">
      <path d="${arcPath(0,33.34,r)}" stroke="${colorLow}" stroke-width="15" fill="none"/>
      <path d="${arcPath(33.34,66.67,r)}" stroke="#c9c9c9" stroke-width="15" fill="none"/>
      <path d="${arcPath(66.67,100,r)}" stroke="${colorHigh}" stroke-width="15" fill="none"/>
      ${has ? `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#1c1c1c"/>` : ''}
      <text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="22" font-weight="800" fill="#1c1c1c" font-family="Vazirmatn, Tahoma, sans-serif">${displayText}</text>
    </svg>
    <div style="font-size:12.5px; color:var(--muted); margin-top:2px">${label}</div>
    ${opts.benchmarkLabel ? `<div style="font-size:10px; color:var(--muted); margin-top:1px">${opts.benchmarkLabel}</div>` : ''}
  </div>`;
}
// میانگین یک فرمول (بر اساس آخرین دوره‌ی هر سهم) در بین هم‌صنعتی‌های همین سهم — برای مقیاس گیج‌ها
function industryPeers(stock){
  if(!stock.industry) return [];
  return Object.values(state.stocks).filter(s=>s.industry===stock.industry);
}
function computeIndustryAvgFormula(stock, key){
  const peers = industryPeers(stock);
  const vals = peers.map(s=>{
    const lp = latestPeriod(s);
    if(!lp) return null;
    return computeMetricsForPeriod(s, lp)[key];
  }).filter(v=>v!=null && isFinite(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function computeIndustryAvgDividendPayout(stock){
  const peers = industryPeers(stock);
  const vals = peers.map(s=>estimateAvgDividendPayout(s)).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
// گیج‌های داشبورد به‌صورت آیتم‌های قابل جابجایی؛ ترتیب نمایش از state.layout.dashboardGaugeOrder میاد
function renderDashboardGauges(ctx){
  const {stock, exportRatio, divAvg, industryDivAvg, m, pe, peScale, industryPE, pdScale, industryPD, growth, dollarGrowth} = ctx;

  // اگه حالت «میانگین TTM» برای این سهم روشن باشه، گیج حاشیه سود هم همون میانگین محاسبه‌شده رو نشون بده (نه فقط فصل اخیر)
  const marginValue = stock && stock.useTTMMargin ? computeTTMAverageMargin(stock) : m.qMargin;
  const marginLabel = stock && stock.useTTMMargin ? 'حاشیه سود (میانگین TTM)' : 'حاشیه سود FIS';
  const widgets = {

    receivables: renderGaugeSVG(m.receivablesRatio!=null? m.receivablesRatio*100 : null, 'نسبت مطالبات', {reverse:true}),
    margin: renderGaugeSVG(marginValue!=null? marginValue*100 : null, marginLabel),
    quickRatio: renderGaugeSVG(m.quickRatio, 'نسبت آنی', {maxScale:2, suffix:'', decimals:2}),
    peF: renderGaugeSVG(pe, 'P/E F', {maxScale: peScale, suffix:'', decimals:1, benchmarkLabel: industryPE!=null? `میانگین صنعت: ${toFa(industryPE.toFixed(1))}` : 'بدون داده صنعت'}),
    pdF: renderGaugeSVG(m.pdRatio, 'P/D F', {maxScale: pdScale, suffix:'', decimals:1, benchmarkLabel: industryPD!=null? `میانگین صنعت: ${toFa(industryPD.toFixed(1))}` : 'بدون داده صنعت'}),
    // رشد فروش دلاری نسبت به بازه‌ی مشابه سال قبل: هر سال به دلار خودش تبدیل شده، این دو عدد دلاری مقایسه می‌شن
    dollarGrowth: renderGaugeSVG(dollarGrowth!=null ? dollarGrowth*100 : null, 'رشد دلاری فروش (سال قبل)', {minScale:-50, maxScale:50, decimals:1, benchmarkLabel: dollarGrowthHint}),

}
function renderOverviewSubtab(stock, lp, m, estSales, estMargin, estAddons, estFinal, pe, exportRatio, usedYTDForSales){

  // (فروش‌تجمعی امسال ÷ دلار روز) نسبت به (فروش‌تجمعی سال قبل ÷ دلار مشابه سال قبل)
  const gmForGrowth = getGoldMarket();
  const dollarToday = gmForGrowth.dollarToday!=null && gmForGrowth.dollarToday!=='' ? Number(gmForGrowth.dollarToday) : null;
  const dollarSamePriorYear = gmForGrowth.dollarSamePriorYear!=null && gmForGrowth.dollarSamePriorYear!=='' ? Number(gmForGrowth.dollarSamePriorYear) : null;
  let dollarGrowth = null;
  if(growth && growth.priorComplete && growth.priorSum>0 && dollarToday>0 && dollarSamePriorYear>0){
    const curUsd = growth.curSum/dollarToday;

  const industryDivAvg = computeIndustryAvgDividendPayout(stock);

  ${m.inventoryDays==null || m.receivableDays==null ? `<div class="hint">برای محاسبه‌ی TTM (۱۲ماهه) این دوره، فیلدهای «دوره مشابه سال قبل» و «آخرین سال مالی کامل» رو هم در تب ورود اطلاعات پر کن (یا اگه در سابقه‌ی این سهم موجود باشن، خودکار پیدا و استفاده می‌شن).</div>`:''}

// سهم‌های زیرمجموعه: نمای کلیِ هر زیرمجموعه + سهم متناسب با درصد مالکیت از سود/فروش/ارزش بازارش
// NAV شرکت سرمایه‌گذاری/هلدینگ = حقوق مالکانه (آخرین دوره) + (ارزش روز پرتفوی سهام بورسی − بهای تمام‌شده همون پرتفوی)
function computeNAV(stock){
  const lp = latestPeriod(stock);
  const equity = lp ? lp.equity : null;
  if(equity==null) return null;
  const X = stock.manual && stock.manual.portfolioMarketValue!=null ? Number(stock.manual.portfolioMarketValue) : null;
  const Y = stock.manual && stock.manual.portfolioBookValue!=null ? Number(stock.manual.portfolioBookValue) : null;
  const diff = (X!=null && Y!=null) ? (X - Y) : 0;
  return equity + diff;
}
function renderSubsidiariesSubtab(stock){
  const subs = stock.subsidiaries || [];
  const unlisted = stock.unlistedHoldings || [];
  let totalProfitShare=0, totalSalesShare=0, totalValueShare=0;
  const listedRows = subs.map(sub=>{
    const subStock = state.stocks[sub.symbol];
    if(!subStock) return `<tr><td>${sub.symbol}</td><td colspan="15" style="color:var(--bad)">این سهم از برنامه حذف شده</td></tr>`;
    const lp = latestPeriod(subStock);
    const m = lp ? computeMetricsForPeriod(subStock, lp) : {};
    const estSales = estimateAnnualSales(subStock);
    const estFinal = estimateFinalNetIncome(subStock);
    const marketCap = subStock.manual && subStock.manual.marketCap!=null ? Number(subStock.manual.marketCap) : null;
    const pe = peF(subStock);
    const pct = sub.percent/100;
    const profitShare = estFinal!=null ? estFinal*pct : null;
    const salesShare = estSales!=null ? estSales*pct : null;
    const valueShare = marketCap!=null ? marketCap*pct : null;
    if(profitShare!=null) totalProfitShare += profitShare;
    if(salesShare!=null) totalSalesShare += salesShare;
    if(valueShare!=null) totalValueShare += valueShare;
    return `<tr>
      <td>${sub.symbol}</td><td>${subStock.name||'—'}</td><td>${toFa(sub.percent)}٪</td>

  }).join('');
  unlisted.forEach(u=>{ if(u.estimatedValue!=null) totalValueShare += Number(u.estimatedValue) * (u.percent/100); });

  const listedTableHtml = !subs.length
    ? `<div class="hint">هنوز سهم بورسیِ زیرمجموعه‌ای ثبت نشده. از تب «مدیریت سهم‌ها»، ردیف همین سهم، روی «+ افزودن زیرمجموعه» بزن.</div>`

    holdingPanel = `

  return `

const marginValueLabelPlugin = {
  id: 'marginValueLabelPlugin',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((ds, dsIndex)=>{
      if(!ds.showValueLabels) return;
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden) return;
      let indices = meta.data.map((_,i)=>i);
      if(ds.labelOnce){
        // فقط روی آخرین نقطه‌ی معتبر (برای خط‌های میانگین ثابت که تکرار برچسب روی هر ماه لازم نیست)
        const lastValid = indices.filter(i=> ds.data[i]!=null).pop();
        indices = lastValid!=null ? [lastValid] : [];
      }
      indices.forEach(i=>{
        const point = meta.data[i];
        const val = ds.data[i];
        if(val==null || point==null) return;
        ctx.save();
        ctx.fillStyle = ds.labelColor || ds.borderColor || '#444';
        const vlFontSize = window.innerWidth <= 640 ? 9 : 11; // هماهنگ با فونت موبایل بقیه‌ی نمودار
        ctx.font = `600 ${vlFontSize}px Vazirmatn, Tahoma, sans-serif`;
        ctx.textAlign = 'center';
        const suffix = ds.valueLabelSuffix ?? '';
        const overrideVal = ds.valueLabelsOverride ? ds.valueLabelsOverride[i] : null;
        const text = overrideVal!=null ? (toFa(overrideVal)+suffix) : ((ds.valueLabelFormatted ? fmt(val) : toFa(val)) + suffix);
        if(ds.labelBackground){
          const w = ctx.measureText(text).width + 10;
          ctx.fillStyle = ds.labelBackground;
          ctx.fillRect(point.x - w/2, point.y - 24, w, 16);
          ctx.fillStyle = ds.labelColor || ds.borderColor || '#444';
        }
        ctx.fillText(text, point.x, point.y - 10);
        ctx.restore();
      });
    });
  }
};

// ادغام عمیق تنظیمات نمودار: برخلاف Object.assign که کل یک کلید (مثلاً scales) رو کامل جایگزین می‌کنه،
// اینجا فقط برگ‌های مشخص‌شده در extra بازنویسی می‌شن و بقیه‌ی تنظیمات پیش‌فرض (مثل فونت موبایل) دست‌نخورده می‌مونن
function deepMergeOptions(base, extra){
  if(!extra || typeof extra!=='object') return base;
  const out = Object.assign({}, base);
  Object.keys(extra).forEach(k=>{
    const ev = extra[k];
    const bv = base[k];
    const bothPlainObjects = ev && typeof ev==='object' && !Array.isArray(ev) && bv && typeof bv==='object' && !Array.isArray(bv);
    out[k] = bothPlainObjects ? deepMergeOptions(bv, ev) : ev;
  });
  return out;
}

function drawDividendGrowthChart(stock){
  const hist = (stock.dividendHistory||[]).slice().sort((a,b)=>a.fiscalYear-b.fiscalYear);
  if(!hist.length) return;
  const approved = hist.map(h=> h.dividendApproved!=null? +Math.abs(h.dividendApproved).toFixed(0) : null);
  // رشد سود مصوب نسبت به سال قبل = (مصوب امسال − مصوب سال قبل) ÷ مصوب سال قبل × ۱۰۰
  const growthPct = hist.map((h,i)=>{
    if(i===0) return null;
    const prevApproved = approved[i-1];
    const curApproved = approved[i];
    if(prevApproved==null || curApproved==null || prevApproved===0) return null;
    return +(((curApproved-prevApproved)/prevApproved)*100).toFixed(1);
  });
  const el = document.getElementById('chartDividendGrowth');
  if(!el) return;
  chartRefs.dividendGrowth = new Chart(el, {
    type:'line',
    data:{labels: hist.map(h=>toFa(h.fiscalYear)), datasets:[

function drawQuarterlyComboChart(stock, periods){
  const sales=[], profit=[], margin=[];

    const opProfit = (ctx.p!=null && ctx.j!=null && ctx.k!=null) ? ctx.p - ctx.j - ctx.k : null;
    sales.push(q!=null? +q.toFixed(0) : null);
    profit.push(opProfit!=null? +opProfit.toFixed(0) : null);
    margin.push(q && opProfit!=null && q!==0 ? +((opProfit/q)*100).toFixed(1) : null);
  });

    type:'bar',
    data:{

function renderMonthlySalesTable(stock){
  const keys = Object.keys(stock.monthlySales||{}).sort().reverse(); // جدیدترین اول

  const totalPages = Math.ceil(keys.length/pageSize);
  if(monthlySalesPage >= totalPages) monthlySalesPage = totalPages-1;
  if(monthlySalesPage < 0) monthlySalesPage = 0;
  const pageKeys = keys.slice(monthlySalesPage*pageSize, monthlySalesPage*pageSize+pageSize);
  const split = stock.monthlySalesSplit || {};
  const rows = pageKeys.map(k=>{
    const [y,mo] = k.split('-');
    const s = split[k];
    return `<tr><td>${toFa(y)}</td><td>${toFa(mo)}</td><td>${fmt(stock.monthlySales[k])}</td>
      <td>${s? fmt(s.domestic) : '—'}</td><td>${s? fmt(s.export) : '—'}</td>

        <span class="delete-row-btn" data-editmonth="${k}" style="color:var(--navy); margin-left:8px">ویرایش</span>
        <span class="delete-row-btn" data-delmonth="${k}">حذف</span>

  }).join('');

    <div class="row" style="justify-content:center; margin-top:10px; gap:14px">
      <button class="btn secondary" id="monthlyPrevPage" ${monthlySalesPage>=totalPages-1?'disabled':''}>‹ قدیمی‌تر</button>

      <button class="btn secondary" id="monthlyNextPage" ${monthlySalesPage<=0?'disabled':''}>جدیدتر ›</button>
    </div>` : '';
  return `<div class="table-wrap"><table>
    <thead><tr><th>سال مالی</th><th>ماه</th><th>فروش کل (م.ت)</th><th>داخلی (م.ت)</th><th>صادراتی (م.ت)</th><th></th></tr></thead>

// دوره‌های ناسازگار رو پیدا می‌کنه — مثلاً وقتی فروش تجمیعیِ یه دوره از دوره‌ی قبلی (با ماه کمتر) کمتره،
// که چون فروش تجمیعیه غیرممکنه، مگر اینکه یکی از دو دوره اشتباه دسته‌بندی شده باشه (باقی‌مونده از قبل از رفع باگ سال مالی غیراستاندارد)
function findInconsistentPeriods(stock){
  const periods = sortPeriods(stock.periods||[]);
  const warnings = [];
  const byYear = {};
  periods.forEach(p=>{ (byYear[p.fiscalYear] = byYear[p.fiscalYear]||[]).push(p); });
  Object.entries(byYear).forEach(([fy, list])=>{
    for(let i=1;i<list.length;i++){
      const prev = list[i-1], cur = list[i];
      if(prev.sales!=null && cur.sales!=null && cur.sales < prev.sales){
        warnings.push(`سال مالی ${toFa(fy)}: فروش دوره‌ی «${toFa(cur.months)} ماهه» (${fmt(cur.sales)}) کمتر از دوره‌ی «${toFa(prev.months)} ماهه» (${fmt(prev.sales)}) است — چون فروش باید تجمیعی و صعودی باشه، احتمالاً یکی از این دو دوره قبلاً با دسته‌بندی اشتباه (قبل از تعمیر سال مالی سفارشی) ثبت شده. توصیه می‌شه ردیفش رو حذف و از برگه خام دوباره پیست کنی.`);
      }
    }
  });
  return warnings;
}
function renderPLRows(stock){
  const periods = sortPeriods(stock.periods||[]).slice().reverse(); // جدیدترین اول
  if(!periods.length) return `<tr><td colspan="10" style="color:var(--muted)">هنوز دوره‌ای ثبت نشده</td></tr>`;
  const totalPages = Math.ceil(periods.length/DATA_TABLE_PAGE_SIZE);

  if(plRowsPage < 0) plRowsPage = 0;
  const pageItems = periods.slice(plRowsPage*DATA_TABLE_PAGE_SIZE, plRowsPage*DATA_TABLE_PAGE_SIZE+DATA_TABLE_PAGE_SIZE);
  const allSorted = sortPeriods(stock.periods||[]);
  return pageItems.map(p=>{
    const ttmS = ttmFlowSelfContained(allSorted, p, 'sales');
    const ttmC = ttmFlowSelfContained(allSorted, p, 'cogs');
    const qNetQ = discreteQuarter(allSorted, p, 'netIncomeQ');
    const m = computeMetricsForPeriod(stock, p);
    return `<tr>
      <td>${toFa(p.fiscalYear)}</td><td>${toFa(p.months)} ماهه</td>
      <td>${fmt(p.netIncomeQ)}</td><td>${fmt(qNetQ)}</td><td>${fmtPct(m.qMargin)}</td>
      <td>${fmt(p.sales)}</td><td>${fmt(p.cogs)}</td>

      </td>
    </tr>`;
  }).join('');
}
function renderPLPager(stock){

function renderBSRows(stock){

/* ========================= تب مقایسه صنعت ========================= */
let industryFilters = []; // فیلترهای فعال جدول مقایسه صنعت: [{id, fieldKey, min, max}]
// فهرست همه‌ی معیارهای قابل‌فیلتر (فرمول‌های ثبت‌شده + چند فیلد ثابت محاسبه‌شده)
function getIndustryFilterFields(){
  const list = getFormulas().filter(f=>f.showInIndustry && !f.pending).map(f=>({
    key: f.key, label: f.name,
    get: (s)=>{ const lp = latestPeriod(s); if(!lp) return null; return computeMetricsForPeriod(s, lp)[f.key]; }
  }));
  list.push({key:'__estAnnualSales', label:'برآورد فروش تا انتهای سال مالی', get:s=>estimateAnnualSales(s)});
  list.push({key:'__estFinalNetIncome', label:'برآورد سود خالص', get:s=>estimateFinalNetIncome(s)});
  list.push({key:'__marketCap', label:'ارزش بازار روز', get:s=>s.manual?.marketCap!=null?Number(s.manual.marketCap):null});
  list.push({key:'__salesGrowth', label:'رشد فروش تجمیعی (٪)', get:s=>{ const g=computeSalesGrowthCum(s); return (g&&g.growth!=null)? g.growth*100 : null; }});
  list.push({key:'__divAvg', label:'میانگین تقسیم سود (٪)', get:s=>{ const d=estimateAvgDividendPayout(s); return d!=null? d*100 : null; }});
  list.push({key:'__exportRatio', label:'نسبت صادراتی (٪)', get:s=>{ const e=computeExportRatio(s); return e? e.ratio*100 : null; }});
  return list;
}
function stockPassesFilters(stock){
  if(!industryFilters.length) return true;
  const fields = getIndustryFilterFields();
  return industryFilters.every(f=>{
    if(f.min==null && f.max==null) return true;
    const fieldDef = fields.find(fl=>fl.key===f.fieldKey);
    if(!fieldDef) return true;
    const val = fieldDef.get(stock);
    if(val==null) return false; // بدون مقدار = مشخص نیست داخل بازه هست یا نه، پس محتاطانه حذفش می‌کنیم
    if(f.min!=null && val<f.min) return false;
    if(f.max!=null && val>f.max) return false;
    return true;
  });
}

/* ========================= تب سبد سرمایه‌گذاری من ========================= */
let editingHoldingId = null;
// نماد سطری که توی جدول سبد سرمایه‌گذاری کلیک شده و باید هایلایت (پررنگ) بمونه — حتی بعد از رندر مجدد صفحه
let selectedHoldingId = null;
/* ========================= طلا و نقره — کاملاً جدا از بخش سهام ========================= */
const OUNCE_TO_GRAM = 31.1034768;
// طلای معامله‌شده در بازار ایران معمولاً ۱۸ عیار (خلوص ۷۵٪) است، در حالی که قیمت انس جهانی بر مبنای طلای خالص (۲۴ عیار) است؛
// برای تبدیل قیمت گرمی طلای خالص (۲۴ عیار) به قیمت مرجع طلای ۱۸ عیار، باید در ۱۸/۲۴ = ۰.۷۵ ضرب کرد.
// این فرمول همون فرمول استاندارد و رایج بازار طلای ایرانه (بدون احتساب اجرت/حق ضرب که مخصوص طلای زینتی خرده‌فروشیه).
const GOLD_18K_FACTOR = 18/24;
function getGoldMarket(){ state.goldMarket = state.goldMarket || {}; return state.goldMarket; }
function getGoldFunds(){ state.goldFunds = state.goldFunds || {}; return state.goldFunds; }
// دلار «تئوریک» در نقطه‌ای از سال = دلار ابتدای سال، مرکب‌شده با میانگین تورم ماهانه به تعداد ماه‌های گذشته
function theoreticalDollar(gm, months){
  const base = gm.dollarStartOfYear!=null && gm.dollarStartOfYear!=='' ? Number(gm.dollarStartOfYear) : null;
  const infl = gm.avgMonthlyInflation!=null && gm.avgMonthlyInflation!=='' ? Number(gm.avgMonthlyInflation) : null;
  if(base==null || infl==null || months==null) return null;
  return base * Math.pow(1 + infl/100, months);
}
// همون منطق ترکیب تورم ماهانه، ولی عمومی برای هر مقدار پایه (طلا/نقره/دلار) — برای محاسبه‌ی «حباب نسبت به تورم»
function theoreticalByInflation(baseVal, gm, months){
  const base = baseVal!=null && baseVal!=='' ? Number(baseVal) : null;
  const infl = gm.avgMonthlyInflation!=null && gm.avgMonthlyInflation!=='' ? Number(gm.avgMonthlyInflation) : null;
  if(base==null || infl==null || months==null) return null;
  return base * Math.pow(1 + infl/100, months);
}
function computeGoldMarketMetrics(){
  const gm = getGoldMarket();
  const monthsElapsed = gm.monthsElapsed!=null && gm.monthsElapsed!=='' ? Number(gm.monthsElapsed) : null;
  const theoDollarToday = monthsElapsed!=null ? theoreticalDollar(gm, monthsElapsed) : null;
  const theoDollarYearEnd = theoreticalDollar(gm, 12);
  const dollarToday = gm.dollarToday!=null && gm.dollarToday!=='' ? Number(gm.dollarToday) : null;
  // حباب دلار: طبق تورم اعلامی و دلار اول سال، دلار امروز باید چه عددی باشه — چقدر پایین‌تر/بالاتر از اون واقعیه
  const dollarBubble = (theoDollarToday && dollarToday!=null) ? (dollarToday - theoDollarToday)/theoDollarToday : null;
  // % تغییر پیش‌بینی‌شده‌ی دلار تا پایان سال نسبت به قیمت امروز (برای نمایش پیش‌بینی پایان سال)
  const dollarYearEndChangeFrac = (dollarToday && theoDollarYearEnd!=null) ? (theoDollarYearEnd/dollarToday - 1) : null;

  const goldOunceToday = gm.goldOunceToday!=null && gm.goldOunceToday!=='' ? Number(gm.goldOunceToday) : null;
  const silverOunceToday = gm.silverOunceToday!=null && gm.silverOunceToday!=='' ? Number(gm.silverOunceToday) : null;
  const goldOunceYearEnd = gm.goldOunceYearEnd!=null && gm.goldOunceYearEnd!=='' ? Number(gm.goldOunceYearEnd) : null;
  const silverOunceYearEnd = gm.silverOunceYearEnd!=null && gm.silverOunceYearEnd!=='' ? Number(gm.silverOunceYearEnd) : null;

  // قیمت طلای خالص (۲۴ عیار، معادل انس جهانی) هر گرم به تومان — مقدار میانی، هنوز تبدیل به ۱۸ عیار نشده
  const goldGramTomanToday = (goldOunceToday!=null && dollarToday!=null) ? (goldOunceToday/OUNCE_TO_GRAM)*dollarToday : null;
  const goldGramTomanYearEnd = (goldOunceYearEnd!=null && theoDollarYearEnd!=null) ? (goldOunceYearEnd/OUNCE_TO_GRAM)*theoDollarYearEnd : null;
  // قیمت نقره (بدون تبدیل عیار — نقره سرمایه‌گذاری معمولاً بر پایه‌ی خلوص ۹۹۹ محاسبه می‌شه، مثل انس جهانی)
  const silverGramTomanToday = (silverOunceToday!=null && dollarToday!=null) ? (silverOunceToday/OUNCE_TO_GRAM)*dollarToday : null;
  const silverGramTomanYearEnd = (silverOunceYearEnd!=null && theoDollarYearEnd!=null) ? (silverOunceYearEnd/OUNCE_TO_GRAM)*theoDollarYearEnd : null;

  // قیمت مرجع طلای ۱۸ عیار (بازار ایران) = قیمت طلای خالص × ۰.۷۵ — این عددیه که واقعاً به‌عنوان «قیمت روز طلا» گزارش می‌شه
  const gold18kGramTomanToday = goldGramTomanToday!=null ? goldGramTomanToday*GOLD_18K_FACTOR : null;
  const gold18kGramTomanYearEnd = goldGramTomanYearEnd!=null ? goldGramTomanYearEnd*GOLD_18K_FACTOR : null;

  const goldYearEndChangeFrac = (goldGramTomanToday && goldGramTomanYearEnd!=null) ? (goldGramTomanYearEnd/goldGramTomanToday - 1) : null;
  const silverYearEndChangeFrac = (silverGramTomanToday && silverGramTomanYearEnd!=null) ? (silverGramTomanYearEnd/silverGramTomanToday - 1) : null;

  // حباب طلا/نقره نسبت به تورم: چون قیمت تومانیِ طلا/نقره صرفاً حاصل‌ضرب «انس جهانی» (که خودش قیمت بازار جهانیه و ربطی به
  // تورم داخلی نداره) در «نرخ دلار» است، حباب این دو فلز دقیقاً از همون معادله‌ی حباب دلار میاد — با این تفاوت که این‌جا
  // مستقیماً قیمت واقعی طلا/نقره (بر مبنای دلار واقعی امروز) رو در مقابل قیمت تئوریک طلا/نقره (بر مبنای همون انس امروز، ولی
  // با دلار تئوریکِ برآمده از تورم مرکب) می‌ذاریم؛ نیازی به ورودی جداگانه‌ی «قیمت طلا/نقره ابتدای سال» نیست.
  const theoGold18kToday = (goldOunceToday!=null && theoDollarToday!=null) ? (goldOunceToday/OUNCE_TO_GRAM)*theoDollarToday*GOLD_18K_FACTOR : null;
  const theoSilverGramToday = (silverOunceToday!=null && theoDollarToday!=null) ? (silverOunceToday/OUNCE_TO_GRAM)*theoDollarToday : null;
  const goldInflationBubble = (theoGold18kToday && gold18kGramTomanToday!=null) ? (gold18kGramTomanToday-theoGold18kToday)/theoGold18kToday : null;
  const silverInflationBubble = (theoSilverGramToday && silverGramTomanToday!=null) ? (silverGramTomanToday-theoSilverGramToday)/theoSilverGramToday : null;

  return { theoDollarToday, theoDollarYearEnd, dollarBubble, dollarToday, dollarYearEndChangeFrac,
    goldGramTomanToday, silverGramTomanToday, goldGramTomanYearEnd, silverGramTomanYearEnd,
    gold18kGramTomanToday, gold18kGramTomanYearEnd, goldYearEndChangeFrac, silverYearEndChangeFrac,
    theoGold18kToday, theoSilverGramToday, goldInflationBubble, silverInflationBubble };
}
// معیارهای هر صندوق: حباب خود صندوق (قیمت تابلو در برابر NAV اعلامی)، حباب دلار (سراسری)، حباب محاسباتی (قیمت تابلو در برابر ارزش ذاتی بر پایه‌ی انس+دلار روز — فقط اگه وزن پشتوانه‌ی هر واحد وارد شده باشه)
function computeFundMetrics(fund, gmm){
  const manual = fund.manual || {};
  const marketPrice = manual.marketPrice!=null && manual.marketPrice!=='' ? Number(manual.marketPrice) : null;
  const nav = manual.nav!=null && manual.nav!=='' ? Number(manual.nav) : null;
  const weightPerUnit = manual.weightPerUnit!=null && manual.weightPerUnit!=='' ? Number(manual.weightPerUnit) : null;

  const fundBubble = (marketPrice!=null && nav) ? (marketPrice-nav)/nav : null;
  const dollarBubble = gmm.dollarBubble;

  // صندوق‌های طلای ایرانی معمولاً بر پایه‌ی طلای ۱۸ عیار پشتوانه دارن، نه طلای خالص ۲۴ عیار؛ برای همین برای صندوق طلا
  // از قیمت مرجع ۱۸ عیار استفاده می‌کنیم (نه goldGramTomanToday خام که معادل طلای خالص/۲۴ عیاره)
  const gramTomanToday = fund.type==='silver' ? gmm.silverGramTomanToday : gmm.gold18kGramTomanToday;
  const fairValueByOunce = (weightPerUnit!=null && gramTomanToday!=null) ? weightPerUnit*gramTomanToday : null;
  const calcBubble = (marketPrice!=null && fairValueByOunce) ? (marketPrice-fairValueByOunce)/fairValueByOunce : null;

  const parts = [fundBubble, dollarBubble, calcBubble].filter(v=>v!=null);
  const totalBubble = parts.length ? parts.reduce((a,b)=>a+b,0) : null;

  const yearEndChangeFrac = fund.type==='silver' ? gmm.silverYearEndChangeFrac : gmm.goldYearEndChangeFrac;
  // سقف احتمالی پایان سال: با فرض این‌که روند جهانی انس + تورم دلار طبق پیش‌بینی پیش بره
  const ceilingPrice = (marketPrice!=null && yearEndChangeFrac!=null) ? marketPrice*(1+yearEndChangeFrac) : null;
  // کف احتمالی: اگه حباب فعلی صندوق (نسبت به NAV) به‌طور کامل تخلیه بشه و برگرده به NAV
  const floorPrice = (marketPrice!=null && nav!=null) ? nav : null;
  const floorChangeFrac = (marketPrice!=null && floorPrice!=null && marketPrice) ? (floorPrice/marketPrice - 1) : null;

  return { marketPrice, nav, weightPerUnit, fundBubble, dollarBubble, calcBubble, totalBubble, yearEndChangeFrac, ceilingPrice, floorPrice, floorChangeFrac };
}

}
