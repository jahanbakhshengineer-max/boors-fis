/* ========================= مودال‌ها ========================= */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

function subsidiaryModal(symbol){
  const stock = state.stocks[symbol];
  if(!stock) return;
  stock.subsidiaries = stock.subsidiaries || [];
  const otherSymbols = Object.keys(state.stocks).filter(s=>s!==symbol);
  const rowsHtml = stock.subsidiaries.length ? stock.subsidiaries.map((sub,idx)=>{
    const subStock = state.stocks[sub.symbol];
    return `<tr>
      <td>${sub.symbol}</td><td>${subStock?(subStock.name||'—'):'<span style="color:var(--bad)">حذف‌شده</span>'}</td>
      <td>${toFa(sub.percent)}٪</td>
      <td><span class="delete-row-btn" data-delsub="${idx}">حذف</span></td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" style="color:var(--muted)">هنوز زیرمجموعه‌ای اضافه نشده</td></tr>`;
  const optionsHtml = otherSymbols.length
    ? otherSymbols.map(s=>`<option value="${s}">${s} — ${state.stocks[s].name||''}</option>`).join('')
    : `<option value="">— ابتدا یه سهم دیگه اضافه کن —</option>`;
  openModal(`
    <h3>سهم‌های زیرمجموعه — ${symbol}</h3>
    <div class="hint" style="margin-bottom:10px">اگه ${symbol} درصدی از یه سهم بورسی دیگه رو داره (مثلاً ۳٪ از یه شرکت دیگه که خودش هم توی این برنامه ثبته)، اینجا اضافه‌ش کن. سود/فروش/ارزش برآوردی اون زیرمجموعه به‌نسبت همین درصد، توی داشبورد ${symbol} → «سهم‌های زیرمجموعه» نشون داده می‌شه.</div>
    <div class="table-wrap" style="margin-bottom:14px"><table>
      <thead><tr><th>نماد</th><th>نام</th><th>درصد مالکیت</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
    <div class="row" style="align-items:flex-end">
      <div class="field" style="width:220px"><label>سهم زیرمجموعه</label><select id="subSymbolSelect">${optionsHtml}</select></div>
      <div class="field" style="width:140px"><label>درصد مالکیت (٪)</label><input id="subPercentInput" type="number" step="0.01" placeholder="مثلاً 3"></div>
      <button class="btn tan" id="addSubsidiaryBtn">افزودن</button>
    </div>
    <div class="row" style="justify-content:flex-end; margin-top:14px">
      <button class="btn secondary" id="cancelModalBtn">بستن</button>
    </div>
  `);
  document.getElementById('cancelModalBtn').onclick = closeModal;
  const addBtn = document.getElementById('addSubsidiaryBtn');
  if(addBtn) addBtn.onclick = ()=>{
    const subSymbol = document.getElementById('subSymbolSelect').value;
    const percent = parseFloat(document.getElementById('subPercentInput').value);
    if(!subSymbol) return showToast('یه سهم زیرمجموعه انتخاب کن');
    if(isNaN(percent) || percent<=0 || percent>100) return showToast('درصد باید بین ۰ تا ۱۰۰ باشه');
    stock.subsidiaries = stock.subsidiaries.filter(s=>s.symbol!==subSymbol);
    stock.subsidiaries.push({symbol:subSymbol, percent});
    saveState();
    subsidiaryModal(symbol);
  };
  document.querySelectorAll('[data-delsub]').forEach(el=>el.onclick=()=>{
    stock.subsidiaries.splice(Number(el.dataset.delsub),1);
    saveState();
    subsidiaryModal(symbol);
  });
}

function addStockModal(editSymbol){
  const existing = editSymbol ? state.stocks[editSymbol] : null;
  const HOLDING_INDUSTRY_NAME = 'هلدینگ و شرکت‌های سرمایه‌گذاری';
  const isHolding = existing ? !!existing.isHolding : false;
  const inds = state.industries.map(i=>`<option value="${i}" ${existing && existing.industry===i?'selected':''}>${i}</option>`).join('');
  const endMonth = existing?.fiscalYearEndMonth || 12;
  const endDay = existing?.fiscalYearEndDay || 29;
  const monthOpts = PERSIAN_MONTH_NAMES.map((m,idx)=>`<option value="${idx+1}" ${idx+1===endMonth?'selected':''}>${m}</option>`).join('');
  openModal(`
    <h3>${existing ? 'ویرایش سهم' : 'افزودن سهم جدید'}</h3>
    <div class="field"><label>نماد سهم</label><input id="newStockSymbol" placeholder="مثلاً شبریز" value="${existing?existing.symbol:''}" ${existing?'disabled':''}></div>
    <div class="field"><label>نام شرکت (اختیاری)</label><input id="newStockName" value="${existing?(existing.name||''):''}"></div>
    <div class="field" style="margin-bottom:10px"><label style="display:flex; align-items:center; gap:6px; cursor:pointer"><input type="checkbox" id="newStockIsHolding" ${isHolding?'checked':''} style="width:auto"> این سهم یک هلدینگ/شرکت سرمایه‌گذاریه (المان‌های NAV در داشبوردش نشون داده می‌شه)</label></div>
    <div class="field"><label>صنعت</label><select id="newStockIndustry" ${isHolding?'disabled':''}>${inds}</select></div>
    <div class="field" style="margin-bottom:4px"><label style="font-weight:700; color:var(--navy)">سال مالی منتهی به:</label></div>
    <div class="row">
      <div class="field" style="flex:1"><label>روز</label><input id="newStockFYEndDay" type="number" min="1" max="31" value="${endDay}"></div>
      <div class="field" style="flex:1"><label>ماه</label><select id="newStockFYEndMonth">${monthOpts}</select></div>
    </div>
    <div class="hint" style="margin-bottom:10px">پیش‌فرض (۲۹ اسفند) برای اکثر شرکت‌ها درسته. اگه این سهم سال مالی‌ای وسط سال دارد (مثلاً بانک‌ها و برخی شرکت‌های سرمایه‌گذاری که پایان سال مالیشون شهریور یا ماه دیگه‌ایه)، همینجا عوضش کن — همه‌ی محاسبات (برآورد فروش، TTM، رشد فروش، نمودارهای روند) خودشون بر همین اساس گروه‌بندی و محاسبه می‌شن، نه بر اساس فروردین تا اسفند تقویمی.</div>
    <div class="field"><label>سال مالی جاری (شمسی) — برای پیش‌فرض فرم‌های ورود اطلاعات</label><input id="newStockFiscalYear" type="number" placeholder="مثلاً 1404" value="${existing?(existing.fiscalYear||''):''}"></div>
    <div class="row" style="justify-content:flex-end; margin-top:10px">
      <button class="btn secondary" id="cancelModalBtn">انصراف</button>
      <button class="btn tan" id="confirmAddStockBtn">${existing ? 'ذخیره تغییرات' : 'افزودن'}</button>
    </div>
  `);
  document.getElementById('cancelModalBtn').onclick = closeModal;

function colLetter(idx){ let s='', n=idx+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function detectHeaderMapping(headerRow, fieldKeys){
  const mapping = {}; const used = new Set();
  fieldKeys.forEach(field=>{
    const keywords = FIELD_KEYWORDS[field] || [];
    let bestCol = null;
    headerRow.forEach((cell, idx)=>{
      if(used.has(idx) || bestCol!=null || cell==null) return;
      const text = String(cell);
      if(keywords.some(kw=>text.includes(kw))) bestCol = idx;
    });
    if(bestCol!=null){ mapping[field]=bestCol; used.add(bestCol); }
  });
  return mapping;
}
function parseIntSafe(v){ const n = parseFlexibleNumber(v); return n==null? null : Math.round(n); }

function openPasteMappingModal(mode, textareaId, rawSheetKey){
  const raw = document.getElementById(textareaId).value.trim();
  if(!raw) return showToast('اول متن رو پیست کن');
  const grid = parseRawGrid(raw);
  if(!grid.length) return showToast('متن نامعتبر است');
  const stock = state.stocks[activeSymbol];
  if(stock){
    stock.rawSheets = stock.rawSheets || {};
    stock.rawSheets[rawSheetKey] = {raw};
    saveState();
  }
  // اول تلاش می‌کنیم بفهمیم آیا این یک جدول «عریض» (دوره‌ها به‌صورت ستون، مثل خام کدال) است یا یک جدول ساده (هر سطر = یک رکورد)
  if(mode==='monthly'){
    const dateCols = detectMonthColumnsExact(grid);
    if(Object.keys(dateCols).length >= 2) return openMonthlyWideModal(grid, dateCols);
  } else if(mode==='dividend'){
    const yearCols = detectYearColumns(grid);
    if(Object.keys(yearCols).length >= 2) return openDividendWideModal(grid, yearCols);
  }
  // اگه ستون‌های دوره‌ای پیدا نشد، یعنی احتمالاً جدول ساده‌ست (هر سطر = یک ماه/سال)؛ به تطبیق‌دهنده‌ی ساده‌ی ستونی می‌سپاریم
  excelImportRows = grid;

  openExcelMappingModal();
}
// تشخیص ستون‌های ماهانه‌ی دقیق (بدون گرد کردن به فصل) — برای برگه‌ی خام فروش ماهانه که هر ماه یک ستون جداست
function detectMonthColumnsExact(grid){
  const cols = {};
  for(let r=0; r<Math.min(grid.length,4); r++){
    grid[r].forEach((cell, colIdx)=>{
      if(cell==null || cols[colIdx]) return;
      const m = RAW_DATE_RE.exec(String(cell));
      if(m) cols[colIdx] = {fiscalYear: parseInt(m[1]), month: parseInt(m[2])};
    });
  }
  return cols;
}
// تشخیص ستون‌های سالی (تاریخ کامل یا فقط یک عدد سال شمسی مثل ۱۴۰۲) — برای برگه‌ی خام مجمع عمومی
const YEAR_ONLY_RE = /^(1[3-4]\d{2})$/;
function detectYearColumns(grid){
  const cols = {};
  for(let r=0; r<Math.min(grid.length,6); r++){
    grid[r].forEach((cell, colIdx)=>{
      if(cell==null || cols[colIdx]) return;
      const text = String(cell).trim();
      const mDate = RAW_DATE_RE.exec(text);
      if(mDate){ cols[colIdx] = {fiscalYear: parseInt(mDate[1])}; return; }
      const mYear = YEAR_ONLY_RE.exec(text);
      if(mYear) cols[colIdx] = {fiscalYear: parseInt(mYear[1])};
    });
  }
  return cols;
}

function runMonthlyWideImport(grid, dateCols){
  const stock = state.stocks[activeSymbol];
  if(!stock) return showToast('اول یک سهم انتخاب کن');
  const rowLabel = document.getElementById('monthlyRowSelect').value;
  const fallbackYear = parseIntSafe(document.getElementById('monthlyFallbackYear').value);
  const multiplier = parseFloatSafe(document.getElementById('monthlyMultiplier').value) || 1;
  const row = grid.find(r=>extractRowLabel(r)===rowLabel);
  if(!row) return showToast('ردیف پیدا نشد');
  stock.monthlySales = stock.monthlySales || {};
  let count = 0;
  Object.entries(dateCols).forEach(([colIdx,d])=>{
    const val = parseFloatSafe(row[colIdx]);
    if(val==null) return;
    const fy = d.fiscalYear || fallbackYear;
    if(!fy) return;
    stock.monthlySales[`${fy}-${d.month}`] = val*multiplier;
    count++;
  });
  saveState(); closeModal();
  showToast(count>0 ? `${toFa(count)} ماه با موفقیت وارد شد` : 'هیچ مقدار معتبری در این ردیف پیدا نشد');
  renderAll();
}

      <button class="btn tan" id="confirmDividendWideBtn">وارد کردن اطلاعات</button>
    </div>
  `);
  document.getElementById('cancelModalBtn').onclick = closeModal;
  document.getElementById('confirmDividendWideBtn').onclick = ()=>runDividendWideImport(grid, yearCols);
}
function runDividendWideImport(grid, yearCols){
  const stock = state.stocks[activeSymbol];
  if(!stock) return showToast('اول یک سهم انتخاب کن');
  const profitLabel = document.getElementById('dividendProfitRowSelect').value;
  const approvedLabel = document.getElementById('dividendApprovedRowSelect').value;
  const multiplier = parseFloatSafe(document.getElementById('dividendMultiplier').value) || 1;
  const profitRow = grid.find(r=>extractRowLabel(r)===profitLabel);
  const approvedRow = grid.find(r=>extractRowLabel(r)===approvedLabel);
  if(!profitRow || !approvedRow) return showToast('ردیف پیدا نشد');
  stock.dividendHistory = stock.dividendHistory || [];
  let count = 0;
  Object.entries(yearCols).forEach(([colIdx,d])=>{
    let profitEndOfPeriod = parseFloatSafe(profitRow[colIdx]);
    let dividendApproved = parseFloatSafe(approvedRow[colIdx]);
    if(profitEndOfPeriod==null && dividendApproved==null) return;
    if(profitEndOfPeriod!=null) profitEndOfPeriod *= multiplier;
    if(dividendApproved!=null) dividendApproved *= multiplier;
    stock.dividendHistory = stock.dividendHistory.filter(h=>h.fiscalYear!==d.fiscalYear);
    stock.dividendHistory.push({fiscalYear: d.fiscalYear, profitEndOfPeriod, dividendApproved});
    count++;
  });
  saveState(); closeModal();
  showToast(count>0 ? `${toFa(count)} سال با موفقیت وارد شد` : 'هیچ مقدار معتبری در این ردیف‌ها پیدا نشد');
  renderAll();
}

/* ========================= گزارش فعالیت ماهانه خام کدال (سرستون گروهی + ردیف داخلی/صادراتی) ========================= */
// ردیف اول این گزارش‌ها سرستون‌های گروهی‌اند (مثل «دوره یک ماهه منتهی به ...» که چند ستون زیرمجموعه دارد)؛
// وقتی از اکسل پیست می‌شه، سلول ادغام‌شده یا خالی می‌مونه یا متنش تکرار می‌شه — این تابع هر دو حالت رو مدیریت می‌کنه.
function parseGroupedHeaderRow(row){
  const groups = [];
  let current = null;
  row.forEach((cell, idx)=>{
    const text = cell ? String(cell).trim() : '';
    if(text && (!current || text!==current.label)){
      current = {label: text, startCol: idx, endCol: row.length-1};
      groups.push(current);
    } else if(current){
      current.endCol = idx;
    }
  });
  return groups;
}
function findAmountColInGroup(group, subHeaderLabel){
  for(let c=group.startCol; c<=group.endCol; c++){
    const h = subHeaderLabel(c);
    // به‌جای عبارت دقیق «مبلغ فروش»، وجود همزمان دو کلمه‌ی «مبلغ» و «فروش» رو چک می‌کنیم (حتی اگه بین دو ردیف سرستون جدا افتاده باشن)
    // چون «مبلغ» به‌تنهایی، ستون مبلغ رو از «مقدار فروش» (تعداد/وزن) و «نرخ فروش» به‌وضوح متمایز می‌کنه
    if(h && h.includes('مبلغ') && h.includes('فروش')) return c;
  }
  // اگه با هر دو کلمه پیدا نشد، فقط دنبال «مبلغ» بگرد (بعضی جدول‌ها ستون رو فقط «مبلغ» صدا می‌زنن، بدون تکرار «فروش»)
  for(let c=group.startCol; c<=group.endCol; c++){
    const h = subHeaderLabel(c);
    if(h && h.includes('مبلغ')) return c;
  }
  return null;
}
// تعداد ردیف‌های سرستون (قبل از اولین ردیف داده‌ی واقعی) رو با شمارش سلول‌های عددی هر ردیف تشخیص می‌ده؛
// ردیف‌های سرستون تقریباً هیچ عدد خامی ندارن (فقط عنوان/تاریخ)، در حالی که ردیف‌های داده حداقل ۲ تا سلول عددی دارن
// یه سلول رو فقط وقتی «واقعاً عددی» در نظر می‌گیریم که هیچ حرف فارسی/عربی توش نباشه.
// isNumericCell/parseFlexibleNumber به‌عمد سخت‌گیر نیستن (چون باید بتونن اعداد با واحد/کاما رو هم بخونن)، برای همین
// یه متنی مثل «از ابتدای سال مالی تا تاریخ ۱۴۰۵/۰۳/۳۱» که تاریخ توشه، بعد از حذف حروف و اسلش، به «۱۴۰۵۰۳۳۱» تبدیل و
// اشتباهاً «عددی» تشخیص داده می‌شد — و همین باعث می‌شد ردیف سرستون اصلی به‌اشتباه به‌عنوان اولین ردیف داده شناسایی بشه.
function looksLikePureNumber(v){
  if(v==null) return false;
  const s = toEnDigits(String(v)).trim();
  if(s==='') return false;
  if(/[\u0600-\u06FF\u0750-\u077Fa-zA-Z]/.test(s)) return false; // حرف فارسی/عربی/لاتین = برچسب متنیه، نه عدد خام
  return parseFlexibleNumber(s)!=null;
}
function detectHeaderRowCount(grid){
  for(let r=0; r<grid.length; r++){
    const numericCount = grid[r].filter(c=>c!=null && c!=='' && looksLikePureNumber(c)).length;
    if(numericCount>=2) return r; // اولین ردیف داده‌ی واقعی؛ همه‌ی ردیف‌های قبلش سرستونن
  }
  return Math.min(2, grid.length); // fallback: حداقل دو ردیف سرستون فرض کن
}
function parseMonthFromGroupLabel(label){
  const m = RAW_DATE_RE.exec(toEnDigits(label));
  if(!m) return null;
  return {fiscalYear: parseInt(m[1]), month: parseInt(m[2])};
}
// تاریخ کامل (سال/ماه/روز) رو از متن یه سرفصل استخراج می‌کنه — برای پیدا کردن سرفصل‌های «از ابتدای سال مالی تا تاریخ X»ی
// که ماه/روزشون با سرفصل «یک ماهه» انتخاب‌شده یکیه (یکی برای سال جاری، یکی برای سال قبل)
function extractRawDateFromLabel(label){
  const m = RAW_DATE_RE.exec(toEnDigits(label));
  if(!m) return null;
  return {year: parseInt(m[1]), month: parseInt(m[2]), day: parseInt(m[3])};
}
function openMonthlyActivityModal(){
  const raw = document.getElementById('monthlyActivityPasteInput').value.trim();
  if(!raw) return showToast('اول متن رو پیست کن');
  const grid = parseRawGrid(raw);
  if(grid.length < 4) return showToast('ساختار جدول ناقصه — باید حداقل ردیف‌های سرستون و چند ردیف داده داشته باشه');
  const stock = state.stocks[activeSymbol];
  if(stock){ stock.rawSheets = stock.rawSheets || {}; stock.rawSheets.monthlyActivity = {raw}; saveState(); }

  const groups = parseGroupedHeaderRow(grid[0]);
  if(!groups.length) return showToast('سرستونی پیدا نشد — مطمئن شو کل جدول با سرستون‌های بالا رو کپی کردی');
  // بعضی جدول‌های کدال سرستون رو توی بیش از یک ردیف می‌شکنن (مثلاً ردیف۱: «فروش»/«تولید»، ردیف۲: «مقدار»/«مبلغ»/«نرخ»)؛
  // قبلاً فقط ردیف دوم (grid[1]) به‌عنوان زیرستون در نظر گرفته می‌شد که باعث می‌شد اگه «مبلغ» توی ردیف سوم بود، اصلاً پیدا نشه
  // یا به‌جاش یه ستون کناری (مثل «مقدار») به‌اشتباه انتخاب بشه. الان تمام ردیف‌های سرستون (قبل از اولین ردیف داده‌ی واقعی) رو با هم ترکیب می‌کنیم.
  const headerRowCount = detectHeaderRowCount(grid);
  const subHeaderLabel = (col)=>{
    const parts = [];
    for(let r=1; r<headerRowCount; r++){
      const t = (grid[r][col]!=null ? String(grid[r][col]) : '').trim();
      if(t && parts[parts.length-1]!==t) parts.push(t);
    }
    return parts.join(' / ');
  };
  // به‌جای برچسب متنی، شماره‌ی دقیق سطر رو نگه می‌داریم — چون عنوان «جمع فروش داخلی/صادراتی» توی گزارش‌های چندمحصولی
  // معمولاً چندبار تکرار می‌شه (یه‌بار زیرمجموعه‌ی هر محصول + یه‌بار جمع کل شرکت در پایین جدول)؛ انتخاب فقط با متن
  // باعث می‌شد همیشه اولین (و اغلب اشتباه، یعنی یه جمع جزئی نه جمع کل) پیدا بشه. ردیف‌های سرستون از این لیست کنار گذاشته می‌شن.
  const rowEntries = grid.map((r,idx)=>({idx, label: extractRowLabel(r)})).filter(e=>e.label && e.idx>=headerRowCount);
  const lastMatchIdx = (matchFn)=>{ let found=null; rowEntries.forEach(e=>{ if(matchFn(e.label)) found=e.idx; }); return found; }; // آخرین match = معمولاً جمع کل که پایین جدوله
  const guessDomesticIdx = lastMatchIdx(l=>l.includes('جمع فروش داخلی')) ?? lastMatchIdx(l=>l.includes('داخلی'));
  const guessExportIdx = lastMatchIdx(l=>l.includes('جمع فروش صادراتی')) ?? lastMatchIdx(l=>l.includes('صادراتی'));
  // ردیف «جمع کل درآمد عملیاتی» (توی گزارش کدال معمولاً فقط با عنوان تک‌کلمه‌ای «جمع» در انتهای جدول میاد، برای همین
  // تطبیق دقیق (نه شامل‌بودن) استفاده می‌شه تا با «جمع فروش داخلی»/«جمع درآمد ارائه خدمات» و... اشتباه گرفته نشه).
  // این ردیف معمولاً کمی با «جمع فروش داخلی + جمع فروش صادراتی» فرق داره، چون یه «بهای تمام‌شده‌ی انتسابی» از درآمد کم می‌شه؛
  // برای همین باید مبلغ نهایی فروش ماهانه از همین ردیف خونده بشه، نه از جمع‌زدن دستیِ داخلی+صادراتی.
  const guessTotalRevenueIdx = lastMatchIdx(l=>l.trim()==='جمع');
  const guessGroupIdx = groups.findIndex(g=>g.label.includes('یک ماهه'));

  // سرفصل‌های «از ابتدای سال مالی تا تاریخ X» که ماه/روزشون دقیقاً با سرفصل «یک ماهه» یکیه رو پیدا می‌کنیم:
  // یکی با همون سال (= YTD سال جاری تا همین ماه) و یکی با سال قبل (= YTD سال قبل تا همون تاریخ) — برای محاسبه‌ی
  // میانگین/تجمیعی فروش ماهانه در داشبورد وقتی ماه‌به‌ماه به‌طور کامل ثبت نشده باشه.
  const oneMonthDate = guessGroupIdx>-1 ? extractRawDateFromLabel(groups[guessGroupIdx].label) : null;
  let guessCurrentYTDIdx = null, guessPriorYTDIdx = null;
  if(oneMonthDate){
    groups.forEach((g,idx)=>{
      if(idx===guessGroupIdx || g.label.includes('اصلاح') || !g.label.includes('از ابتدای')) return;
      const d = extractRawDateFromLabel(g.label);
      if(!d || d.month!==oneMonthDate.month || d.day!==oneMonthDate.day) return;
      if(d.year===oneMonthDate.year) guessCurrentYTDIdx = idx;
      else if(d.year===oneMonthDate.year-1) guessPriorYTDIdx = idx;
    });
  }
  const ytdGroupOpts = (guessIdx)=> `<option value="">— استفاده نکن —</option>` + groups.map((g,idx)=>`<option value="${idx}" ${idx===guessIdx?'selected':''}>${g.label}</option>`).join('');

  const groupOpts = groups.map((g,idx)=>`<option value="${idx}" ${idx===(guessGroupIdx>-1?guessGroupIdx:0)?'selected':''}>${g.label}</option>`).join('');
  // شماره‌ی سطر رو جلوی هر گزینه نشون می‌دیم تا اگه عنوان تکراری بود (چند «جمع فروش داخلی»)، بتونی دقیقاً همونی که می‌خوای رو پیدا کنی
  const rowOpts = (guessIdx)=> `<option value="">— انتخاب نشده —</option>` + rowEntries.map(e=>`<option value="${e.idx}" ${e.idx===guessIdx?'selected':''}>سطر ${toFa(e.idx+1)}: ${e.label}</option>`).join('');
  // ستون‌های زیرمجموعه‌ی یه سرفصل (مثلاً زیر «یک ماهه منتهی به ...»: مقدار تولید | مقدار فروش | مبلغ فروش | نرخ فروش...)
  // رو برای انتخاب دستی می‌سازیم؛ چون تشخیص خودکار («مبلغ فروش» توی متن ستون) همیشه با عبارت دقیق کدال یکی نیست
  const buildColOptions = (groupIdx)=>{
    const group = groups[groupIdx];
    if(!group) return '';
    const autoCol = findAmountColInGroup(group, subHeaderLabel);

      opts.push(`<option value="${c}" ${c===autoCol?'selected':''}>ستون ${toFa(c+1)}: ${headerText}</option>`);
    }
    return opts.join('');
  };

  openModal(`
    <h3 style="margin-bottom:4px">تطبیق گزارش فعالیت ماهانه خام کدال</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px">${toFa(groups.length)} سرفصل شناسایی شد. سرفصل «یک ماهه» برای ثبت یک ماه گزینه‌ی درستیه؛ سرفصل‌های تجمیعی («از ابتدای سال مالی...») مناسب فروش ماهانه نیستن.</div>
    <div class="field" style="margin-bottom:9px"><label>سرفصل (دوره مورد نظر)</label><select id="matGroupSelect">${groupOpts}</select></div>
    <div class="field" style="margin-bottom:9px"><label>ستون «مبلغ فروش» زیر همین سرفصل <span style="color:var(--teal)">(اگه تشخیص خودکار غلط بود، دستی عوضش کن)</span></label><select id="matAmountCol">${buildColOptions(guessGroupIdx>-1?guessGroupIdx:0)}</select></div>
    <div class="field" style="margin-bottom:9px"><label>ردیف «جمع فروش داخلی» <span style="color:var(--teal)">(اگه چند بار تکرار شده، شماره سطرِ جمع کل رو انتخاب کن)</span></label><select id="matDomesticRow">${rowOpts(guessDomesticIdx)}</select></div>
    <div class="field" style="margin-bottom:9px"><label>ردیف «جمع فروش صادراتی»</label><select id="matExportRow">${rowOpts(guessExportIdx)}</select></div>
    <div class="field" style="margin-bottom:9px"><label>ردیف «جمع کل درآمد عملیاتی» <span style="color:var(--teal)">(ردیف «جمع» در انتهای جدول — به‌خاطر بهای تمام‌شده‌ی انتسابی، معمولاً کمی با جمعِ داخلی+صادراتی فرق داره)</span></label><select id="matTotalRevenueRow">${rowOpts(guessTotalRevenueIdx)}</select></div>
    <div style="font-size:11.5px; color:var(--muted); margin:12px 0 6px; padding-top:10px; border-top:1px solid var(--line)">

    </div>
    <div class="field" style="margin-bottom:9px"><label>سرفصل «از ابتدای سال مالی تا تاریخ [آخرین گزارش]» (YTD سال جاری)</label><select id="matCurrentYTDGroup">${ytdGroupOpts(guessCurrentYTDIdx)}</select></div>
    <div class="field" style="margin-bottom:9px"><label>سرفصل «از ابتدای سال مالی تا همون تاریخ، سال قبل» (YTD سال قبل)</label><select id="matPriorYTDGroup">${ytdGroupOpts(guessPriorYTDIdx)}</select></div>
    <div class="row">
      <div class="field" style="flex:1"><label>سال مالی (اگه از سرفصل قابل تشخیص نبود)</label><input id="matFallbackYear" type="number" placeholder="مثلاً 1404"></div>
      <div class="field" style="flex:1"><label>ماه (اگه از سرفصل قابل تشخیص نبود)</label><input id="matFallbackMonth" type="number" min="1" max="12"></div>
    </div>
    <div class="field" style="margin-bottom:9px"><label>ضریب تبدیل واحد (پیش‌فرض میلیون‌ریال→میلیاردتومان = 0.0001)</label><input id="matMultiplier" type="number" value="0.0001" step="0.0001"></div>
    <div style="font-size:11.5px; color:var(--muted); margin-bottom:6px">پیش‌نمایش چند ردیف اول (شماره‌ی سطر توی ستون اول) — ${toFa(headerRowCount)} ردیف اول به‌عنوان سرستون تشخیص داده شد:</div>
    <div class="table-wrap" style="max-height:150px; overflow:auto"><table style="font-size:11px"><tbody>${grid.slice(0,Math.max(4,headerRowCount+2)).map((r,idx)=>`<tr style="${idx<headerRowCount?'background:#f6f2e8; font-weight:700':''}"><td style="color:var(--muted)">${toFa(idx+1)}</td>${r.slice(0,8).map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>

    <div class="row" style="justify-content:flex-end; margin-top:14px">

      <button class="btn tan" id="confirmMonthlyActivityBtn">وارد کردن این ماه</button>
    </div>

  const computeGroupTotal = (groupIdx)=>{

    if(!g) return null;
    const col = findAmountColInGroup(g, subHeaderLabel);
    if(col==null) return null;
    const domesticIdx = document.getElementById('matDomesticRow').value;
    const exportIdx = document.getElementById('matExportRow').value;

    const eVal = exportIdx!=='' ? parseFloatSafe(grid[parseInt(exportIdx)]?.[col]) : null;
    if(dVal==null && eVal==null) return null;
    return (dVal||0) + (eVal||0);

  const updatePreview = ()=>{
    const domesticIdx = document.getElementById('matDomesticRow').value;

    // لحاظ کرده)؛ فقط اگه این ردیف انتخاب/پیدا نشده باشه، به‌عنوان جایگزین از جمع داخلی+صادراتی استفاده می‌شه.
    const finalTotal = totalRevenueVal!=null ? totalRevenueVal : domesticExportSum;
    const currentYTDVal = computeGroupTotal(document.getElementById('matCurrentYTDGroup').value);

function runMonthlyActivityImport(grid, groups){
  const stock = state.stocks[activeSymbol];
  if(!stock) return showToast('اول یک سهم انتخاب کن');
  const groupIdx = parseInt(document.getElementById('matGroupSelect').value);
  const group = groups[groupIdx];
  const domesticIdxVal = document.getElementById('matDomesticRow').value;
  const exportIdxVal = document.getElementById('matExportRow').value;
  const totalRevenueIdxVal = document.getElementById('matTotalRevenueRow').value;
  const amountColVal = document.getElementById('matAmountCol').value;
  const fallbackYear = parseIntSafe(document.getElementById('matFallbackYear').value);
  const fallbackMonth = parseIntSafe(document.getElementById('matFallbackMonth').value);
  const multiplier = parseFloatSafe(document.getElementById('matMultiplier').value) || 1;
  const currentYTDGroupVal = document.getElementById('matCurrentYTDGroup').value;
  const priorYTDGroupVal = document.getElementById('matPriorYTDGroup').value;

  if(amountColVal==='') return showToast('ستون «مبلغ فروش» رو انتخاب کن');
  const amountCol = parseInt(amountColVal);
  if(!domesticIdxVal && !exportIdxVal) return showToast('حداقل یکی از ردیف‌های داخلی/صادراتی رو انتخاب کن (برای محاسبه‌ی درصد فروش صادراتی)');

  const domesticRow = domesticIdxVal ? grid[parseInt(domesticIdxVal)] : null;
  const exportRow = exportIdxVal ? grid[parseInt(exportIdxVal)] : null;
  const domesticVal = domesticRow ? parseFloatSafe(domesticRow[amountCol]) : null;
  const exportVal = exportRow ? parseFloatSafe(exportRow[amountCol]) : null;
  if(domesticVal==null && exportVal==null) return showToast('مقداری در ردیف‌های انتخابی، زیر این ستون پیدا نشد');

  // مبلغ نهایی فروش ماهانه از ردیف «جمع کل درآمد عملیاتی» (ردیف «جمع») خونده می‌شه — نه از جمع‌زدن دستیِ داخلی+صادراتی —
  // چون توی گزارش کدال یه «بهای تمام‌شده‌ی انتسابی» از این دو کم می‌شه تا به عدد واقعیِ درآمد عملیاتی برسه.
  // ردیف داخلی/صادراتی فقط برای محاسبه‌ی «درصد فروش صادراتی» (computeExportRatio) نگه داشته می‌شن.
  const totalRevenueRow = totalRevenueIdxVal ? grid[parseInt(totalRevenueIdxVal)] : null;
  const totalRevenueVal = totalRevenueRow ? parseFloatSafe(totalRevenueRow[amountCol]) : null;
  let usedFallbackTotal = false;
  let total;
  if(totalRevenueVal!=null){
    total = totalRevenueVal;
  } else {
    total = (domesticVal||0) + (exportVal||0);
    usedFallbackTotal = true;
  }

  const parsed = parseMonthFromGroupLabel(group.label);
  const fy = parsed?.fiscalYear || fallbackYear;
  const month = parsed?.month || fallbackMonth;
  if(!fy || !month) return showToast('سال/ماه این سرفصل قابل تشخیص نیست؛ سال و ماه رو در فیلدهای پایین دستی وارد کن');

  stock.monthlySales = stock.monthlySales || {};
  stock.monthlySales[`${fy}-${month}`] = total * multiplier;
  stock.monthlySalesSplit = stock.monthlySalesSplit || {};
  stock.monthlySalesSplit[`${fy}-${month}`] = {domestic:(domesticVal||0)*multiplier, export:(exportVal||0)*multiplier};

  // اگه سرفصل‌های YTD (از ابتدای سال مالی تا تاریخ) هم انتخاب شده باشن، برای استفاده به‌عنوان جایگزین محاسبه‌ی
  // میانگین/تجمیعی فروش ماهانه در داشبورد (وقتی ماه‌به‌ماه به‌طور کامل ثبت نشده) ذخیره‌شون می‌کنیم
  const computeGroupTotal = (groupIdxVal)=>{
    if(groupIdxVal==null || groupIdxVal==='') return null;
    const g = groups[parseInt(groupIdxVal)];
    if(!g) return null;
    const headerRowCount = detectHeaderRowCount(grid);
    const subHeaderLabel = (col)=>{
      const parts = [];
      for(let r=1; r<headerRowCount; r++){
        const t = (grid[r][col]!=null ? String(grid[r][col]) : '').trim();
        if(t && parts[parts.length-1]!==t) parts.push(t);
      }
      return parts.join(' / ');
    };
    const col = findAmountColInGroup(g, subHeaderLabel);
    if(col==null) return null;
    // اینجا هم مثل ماه اصلی، ترجیح با ردیف «جمع کل درآمد عملیاتی»ه (چون بهای تمام‌شده‌ی انتسابی رو لحاظ کرده)؛
    // فقط اگه انتخاب نشده باشه، از جمع داخلی+صادراتی به‌عنوان جایگزین استفاده می‌شه.
    const totalRow = totalRevenueIdxVal ? grid[parseInt(totalRevenueIdxVal)] : null;
    const totalVal = totalRow ? parseFloatSafe(totalRow[col]) : null;
    if(totalVal!=null) return totalVal;
    const dRow = domesticIdxVal ? grid[parseInt(domesticIdxVal)] : null;
    const eRow = exportIdxVal ? grid[parseInt(exportIdxVal)] : null;
    const dVal = dRow ? parseFloatSafe(dRow[col]) : null;
    const eVal = eRow ? parseFloatSafe(eRow[col]) : null;
    if(dVal==null && eVal==null) return null;
    return (dVal||0) + (eVal||0);
  };
  const currentYTDRaw = computeGroupTotal(currentYTDGroupVal);
  const priorYTDRaw = computeGroupTotal(priorYTDGroupVal);
  let ytdNote = '';
  if(currentYTDRaw!=null){
    const endM = stockFYEndMonth(stock);
    const {fiscalYear: realFY, monthInFY} = calendarToFiscalMonth(fy, month, endM);
    stock.monthlySalesYTD = stock.monthlySalesYTD || {};
    stock.monthlySalesYTD[realFY] = {
      throughMonth: monthInFY,
      currentYTD: currentYTDRaw * multiplier,
      priorYearYTD: priorYTDRaw!=null ? priorYTDRaw*multiplier : (stock.monthlySalesYTD[realFY]?.priorYearYTD ?? null)
    };
    ytdNote = ` — YTD تا ماه ${toFa(monthInFY)} سال مالی هم ذخیره شد (${fmt(currentYTDRaw*multiplier)} م.ت)`;
  }

  saveState(); closeModal();
  showToast(`ماه ${toFa(month)}/${toFa(fy)} ثبت شد: ${fmt(total*multiplier)} میلیارد تومان (${usedFallbackTotal ? 'جمع داخلی+صادراتی، چون ردیف «جمع کل» انتخاب نشده بود' : 'از ردیف «جمع کل درآمد عملیاتی»'})${ytdNote}`);
  renderAll();
}
function handleExcelFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      if(!rows.length) return showToast('فایل خالی به‌نظر می‌رسه');
      excelImportRows = rows;
      openExcelMappingModal();
    }catch(err){ showToast('خوندن فایل اکسل با خطا مواجه شد'); console.error(err); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function runExcelImport(){
  const stock = state.stocks[activeSymbol];
  if(!stock) return showToast('اول یک سهم انتخاب کن');
  const mapping = {};
  document.querySelectorAll('.excelFieldSelect').forEach(sel=>{
    mapping[sel.dataset.fieldkey] = sel.value===''? null : parseInt(sel.value);
  });
  const headerRow = excelImportRows[0] || [];
  const dataRows = excelImportRows.slice(1).filter(r=> r && r.some(c=>c!=null && c!==''));
  let count = 0;
  if(excelImportMode==='monthly'){
    if(mapping.month==null || mapping.value==null) return showToast('حداقل ستون «ماه» و «مقدار فروش» را مشخص کن');
    const defaultYearEl = document.getElementById('excelDefaultYear');
    const defaultYear = defaultYearEl ? parseIntSafe(defaultYearEl.value) : null;
    stock.monthlySales = stock.monthlySales || {};
    dataRows.forEach(r=>{
      const month = parseIntSafe(r[mapping.month]);
      const value = parseFloatSafeExcelCurrency(r[mapping.value]);
      const year = mapping.fiscalYear!=null ? parseIntSafe(r[mapping.fiscalYear]) : defaultYear;
      if(!month || month<1 || month>12 || value==null || !year) return;
      stock.monthlySales[`${year}-${month}`] = value;
      count++;
    });
  } else if(excelImportMode==='dividend'){
    if(mapping.fiscalYear==null || (mapping.profitEndOfPeriod==null && mapping.dividendApproved==null)) return showToast('حداقل ستون «سال مالی» و یکی از دو ستون سود را مشخص کن');
    stock.dividendHistory = stock.dividendHistory || [];
    dataRows.forEach(r=>{
      const fiscalYear = parseIntSafe(r[mapping.fiscalYear]);
      const profitEndOfPeriod = mapping.profitEndOfPeriod!=null ? parseFloatSafe(r[mapping.profitEndOfPeriod]) : null;
      const dividendApproved = mapping.dividendApproved!=null ? parseFloatSafe(r[mapping.dividendApproved]) : null;
      if(!fiscalYear || (profitEndOfPeriod==null && dividendApproved==null)) return;
      stock.dividendHistory = stock.dividendHistory.filter(h=>h.fiscalYear!==fiscalYear);
      stock.dividendHistory.push({fiscalYear, profitEndOfPeriod, dividendApproved});
      count++;
    });
  } else {
    if(mapping.fiscalYear==null || mapping.months==null) return showToast('حداقل ستون «سال مالی» و «دوره» را مشخص کن');
    stock.periods = stock.periods || [];
    dataRows.forEach(r=>{
      const fiscalYear = parseIntSafe(r[mapping.fiscalYear]);
      const months = parseIntSafe(r[mapping.months]);
      if(!fiscalYear || ![3,6,9,12].includes(months)) return;
      const entry = upsertPeriod(stock, fiscalYear, months);
      if(mapping.reportDate!=null) entry.reportDate = r[mapping.reportDate] ?? null;
      if(mapping.netIncomeQ!=null) entry.netIncomeQ = parseFloatSafeExcelCurrency(r[mapping.netIncomeQ]);
      if(mapping.otherIncomeQ!=null) entry.otherIncomeQ = parseFloatSafeExcelCurrency(r[mapping.otherIncomeQ]);
      if(mapping.otherNonOperatingQ!=null) entry.otherNonOperatingQ = parseFloatSafeExcelCurrency(r[mapping.otherNonOperatingQ]);
      if(mapping.sales!=null) entry.sales = parseFloatSafeExcelCurrency(r[mapping.sales]);
      if(mapping.cogs!=null) entry.cogs = parseFloatSafeExcelCurrency(r[mapping.cogs]);
      if(mapping.salesSamePriorPeriod!=null) entry.salesSamePriorPeriod = parseFloatSafeExcelCurrency(r[mapping.salesSamePriorPeriod]);
      if(mapping.cogsSamePriorPeriod!=null) entry.cogsSamePriorPeriod = parseFloatSafeExcelCurrency(r[mapping.cogsSamePriorPeriod]);
      if(mapping.salesLastFullYear!=null) entry.salesLastFullYear = parseFloatSafeExcelCurrency(r[mapping.salesLastFullYear]);
      if(mapping.cogsLastFullYear!=null) entry.cogsLastFullYear = parseFloatSafeExcelCurrency(r[mapping.cogsLastFullYear]);
      if(mapping.inventory!=null) entry.inventory = parseFloatSafeExcelCurrency(r[mapping.inventory]);
      if(mapping.receivables!=null) entry.receivables = parseFloatSafeExcelCurrency(r[mapping.receivables]);
      if(mapping.totalAssets!=null) entry.totalAssets = parseFloatSafeExcelCurrency(r[mapping.totalAssets]);
      if(mapping.equity!=null) entry.equity = parseFloatSafeExcelCurrency(r[mapping.equity]);
      if(mapping.currentAssets!=null) entry.currentAssets = parseFloatSafeExcelCurrency(r[mapping.currentAssets]);
      if(mapping.prepaid!=null) entry.prepaid = parseFloatSafeExcelCurrency(r[mapping.prepaid]);
      if(mapping.currentLiabilities!=null) entry.currentLiabilities = parseFloatSafeExcelCurrency(r[mapping.currentLiabilities]);
      count++;
    });
  }
  saveState(); closeModal();
  showToast(count>0 ? `${toFa(count)} ردیف با موفقیت وارد شد` : 'هیچ ردیف معتبری پیدا نشد — نگاشت ستون‌ها را بررسی کن');
  renderAll();
}

const FA_DIGIT_MAP = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function toEnDigits(s){ if(s==null) return s; return String(s).replace(/[۰-۹٠-٩]/g, d=>FA_DIGIT_MAP[d]||d); }
// عدد رو از هر شکلی که کپی‌پیست شده باشه (با کاما، با پرانتز به‌جای منفی، با واحد پول، با فاصله اضافه) استخراج می‌کنه
function parseFlexibleNumber(v){
  if(v==null) return null;
  let s = toEnDigits(String(v)).trim();
  if(s==='' || s==='-' || s==='—' || s==='ـ') return null;
  const isParenNegative = /^\(.*\)$/.test(s);
  if(isParenNegative) s = s.slice(1,-1);
  // حذف واحدهای پول/درصد و کاراکترهای غیرعددی رایج (فاصله، ٬ کاما فارسی، ریال، تومان، % و...)
  s = s.replace(/[،٬,\s]/g,'').replace(/ریال|تومان|میلیون|میلیارد|درصد|%/g,'');
  s = s.replace(/[^\d.\-+]/g,'');
  if(s==='' || s==='-' || s==='+' || s==='.') return null;
  let n = Number(s);
  if(isNaN(n)) return null;
  if(isParenNegative) n = -Math.abs(n);
  return n;
}
// تشخیص جداکننده و شکستن متن پیست‌شده به جدول — تب (حالت معمول کپی از اکسل)، در نبود تب: چند فاصله‌ی پشت‌سرهم یا کاما (کپی از PDF/سایت)
// وقتی از یه صفحه‌ی وب (مثل جدول کدال) کپی می‌کنیم، مرورگر معمولاً دو نسخه توی کلیپ‌بورد می‌ذاره: «متن ساده» (که کدال هر سلول رو
// جدا جدا و بدون هیچ جداکننده‌ای پشت سر هم می‌فرسته، برای همینه که توی textarea همه‌چی عمودی می‌افته) و «HTML» (که ساختار واقعی
// جدول یعنی <table>/<tr>/<td> رو نگه می‌داره). وقتی توی اکسل پیست می‌کنی، اکسل از همون نسخه‌ی HTML برای بازسازی جدول استفاده
// می‌کنه — نه از متن ساده. اینجا هم دقیقاً همون کار رو انجام می‌دیم تا نیازی به رفت‌وبرگشت از اکسل نباشه.
// تبدیل کامل یه <table> به grid دوبعدی با پشتیبانی از colspan (ادغام افقی) و rowspan (ادغام عمودی).
// بدون rowspan، سرستونی که روی دو ردیف کشیده شده (مثلاً «ردیف»/«شرح») باعث می‌شد ردیف زیرستون یک یا چند خونه
// نسبت به سرستون اصلی و ردیف‌های داده جابه‌جا (shift) بشه — و همین دقیقاً چیزی بود که باعث می‌شد انتخاب یک سرفصل،
// عدد سرفصل کناری رو بخونه. الگوریتم زیر همون کاری رو می‌کنه که اکسل موقع پیست از کلیپ‌بورد HTML انجام می‌ده.
function htmlTableToGrid(table){
  const rows = Array.from(table.querySelectorAll('tr'));
  const grid = [];
  const pending = {}; // colIdx -> {text, rowsLeft} برای سلول‌هایی که rowspan دارن و باید توی ردیف‌های بعدی هم تکرار بشن
  rows.forEach(tr=>{
    const cellsEls = Array.from(tr.children).filter(el=>/^(TD|TH)$/i.test(el.tagName));
    const rowArr = [];
    let col = 0, ci = 0;
    while(ci < cellsEls.length || (pending[col] && pending[col].rowsLeft > 0)){
      if(pending[col] && pending[col].rowsLeft > 0){
        rowArr[col] = pending[col].text;
        pending[col].rowsLeft--;
        if(pending[col].rowsLeft<=0) delete pending[col];
        col++;
        continue;
      }
      if(ci < cellsEls.length){
        const td = cellsEls[ci++];
        const text = (td.innerText!=null ? td.innerText : (td.textContent||'')).replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim();
        const colspan = parseInt(td.getAttribute('colspan')||'1',10) || 1;
        const rowspan = parseInt(td.getAttribute('rowspan')||'1',10) || 1;
        for(let s=0;s<colspan;s++){
          rowArr[col] = text;
          if(rowspan>1) pending[col] = {text, rowsLeft: rowspan-1};
          col++;
        }
      } else break;
    }
    grid.push(rowArr);
  });
  // مطمئن می‌شیم همه‌ی سطرها به یه تعداد ستون برسن (سلول‌های خالی انتهایی رو با رشته‌ی خالی پر می‌کنیم)
  const maxCols = Math.max(0, ...grid.map(r=>r.length));
  return grid.map(r=>{ const out=r.slice(); for(let c=0;c<maxCols;c++) if(out[c]===undefined) out[c]=''; return out; });
}
function htmlTableToTSV(html){
  try{
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const table = doc.querySelector('table');
    if(!table) return null;
    const grid = htmlTableToGrid(table);
    const lines = grid.map(r=>r.join('\t')).filter(l=> l.replace(/\t/g,'').trim()!=='');
    return lines.length ? lines.join('\n') : null;
  } catch(e){ return null; }
}
// روی فیلدهای پیستِ جدول خام (کدال)، رفتار پیش‌فرض paste رو با نسخه‌ی هوشمند جایگزین می‌کنیم:
// اگه کلیپ‌بورد یه <table> واقعی داشته باشه (مثلاً از کدال یا هر سایت دیگه)، ساختار سطر/ستونش رو با تب بازسازی می‌کنیم؛
// وگرنه (مثلاً پیست از خود اکسل که خودش tab-separated می‌فرسته) رفتار عادی مرورگر دست‌نخورده می‌مونه.
function wireSmartTablePaste(textareaId){
  const el = document.getElementById(textareaId);
  if(!el) return;
  el.onpaste = (e)=>{
    const html = e.clipboardData && e.clipboardData.getData('text/html');
    if(!html) return;
    const tsv = htmlTableToTSV(html);
    if(!tsv) return; // جدولی توی HTML پیدا نشد؛ بذار پیست معمولی (متن ساده) انجام بشه
    e.preventDefault();
    const start = el.selectionStart, end = el.selectionEnd;
    el.value = el.value.slice(0,start) + tsv + el.value.slice(end);
    const pos = start + tsv.length;
    el.selectionStart = el.selectionEnd = pos;
    showToast('جدول با ساختار سطر/ستون درست پیست شد ✅');
  };
}
function detectDelimiter(text){
  if(text.includes('\t')) return '\t';
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  const commaLines = lines.filter(l=>(l.match(/,/g)||[]).length>=2).length;
  if(lines.length && commaLines/lines.length > 0.6) return ',';
  return /\s{2,}/; // چند فاصله پشت‌سرهم = جداکننده ستون (رجکس، نه رشته)
}
function parseRawGrid(text){
  const delim = detectDelimiter(text);
  return text.split(/\r?\n/).filter(l=>l.length).map(line=>{
    const cells = line.split(delim).map(c=>toEnDigits(c.trim()));
    // فقط وقتی جداکننده تب/کاما نیست (یعنی رجکسِ «چند فاصله پشت‌سرهم» به‌کار رفته، حالت کمتر مطمئنِ کپی از PDF/سایت)،
    // ممکنه split یه سلول خالیِ مصنوعی درست ابتدا/انتهای خط بسازه که باید حذف بشه. سلول‌های خالیِ وسط جدول رو دست نمی‌زنیم،
    // چون توی جدول‌های واقعی (خصوصاً ردیف‌های «جمع» که نرخ/واحد ندارن) کاملاً معنادارن و حذفشون هم‌ترازی ستون‌ها با سرستون رو خراب می‌کنه.
    if(delim!=='\t' && delim!==','){
      while(cells.length>1 && cells[0]==='') cells.shift();
      while(cells.length>1 && cells[cells.length-1]==='') cells.pop();
    }
    return cells;
  });
}
function transposeGrid(grid){
  const maxCols = Math.max(...grid.map(r=>r.length), 0);
  const out = [];
  for(let c=0;c<maxCols;c++){ out.push(grid.map(r=>r[c]!==undefined?r[c]:'')); }
  return out;
}
function isNumericCell(v){
  return parseFlexibleNumber(v)!=null;
}
function extractRowLabel(row){
  for(const cell of row){
    if(cell!=null && cell!=='' && !isNumericCell(cell)) return cell;
  }
  return null;
}
// الگوهای مختلف تاریخ/دوره که ممکنه توی برگه‌های مختلف کدال/سایت‌ها دیده بشه:
// ۱۴۰۳/۰۳/۳۱ یا ۱۴۰۳/۳/۳۱ یا ۱۴۰۳-۰۳-۳۱ یا «۱۴۰۳ - ۳ ماهه» یا «۳ ماهه منتهی به ۱۴۰۳»
const RAW_DATE_RE = /(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/;
const RAW_YEAR_MONTHS_RE = /(\d{4}).{0,12}?(\d{1,2})\s*ماهه|(\d{1,2})\s*ماهه.{0,12}?(\d{4})/;
function monthsBucket(monthInFY){ monthInFY=parseInt(monthInFY); if(monthInFY<=3) return 3; if(monthInFY<=6) return 6; if(monthInFY<=9) return 9; return 12; }
// تشخیص ستون‌های تاریخ از برگه‌ی پیست‌شده — endMonth = ماه پایان سال مالیِ همین سهم (نه لزوماً اسفند/۱۲)
// یه تاریخ تقویمی مثل ۱۴۰۳/۰۳/۳۱ برای سهمی با پایان سال مالی مثلاً آذر (۹)، در واقع ماه ششم سال مالیشه، نه سوم —
// این تابع اول تاریخ تقویمی رو به «چندمین ماه از سال مالیِ همین شرکت» تبدیل می‌کنه، بعد به نزدیک‌ترین ۳/۶/۹/۱۲ گرد می‌کنه
function detectDateColumns(grid, endMonth){
  endMonth = endMonth || 12;
  const cols = {};
  for(let r=0; r<Math.min(grid.length,4); r++){
    grid[r].forEach((cell, colIdx)=>{
      if(cell==null || cols[colIdx]) return;
      const str = String(cell);
      const m = RAW_DATE_RE.exec(str);
      if(m){
        const calYear = parseInt(m[1]), calMonth = parseInt(m[2]);
        const {fiscalYear, monthInFY} = calendarToFiscalMonth(calYear, calMonth, endMonth);
        cols[colIdx] = {fiscalYear, months: monthsBucket(monthInFY)};
        return;
      }
      const my = RAW_YEAR_MONTHS_RE.exec(str);
      if(my){
        // این حالت («۳ ماهه ۱۴۰۳») صراحتاً تعداد ماه از ابتدای سال مالی رو می‌گه، نیازی به تبدیل تقویمی نداره
        const year = parseInt(my[1] || my[4]);
        const months = parseInt(my[2] || my[3]);
        if(year && months) cols[colIdx] = {fiscalYear: year, months: [3,6,9,12].includes(months)?months:monthsBucket(months)};
      }
    });
  }
  return cols; // {colIdx: {fiscalYear, months}}
}
function guessRowForField(grid, fieldKey){
  const keywords = FIELD_KEYWORDS[fieldKey] || [];
  for(const row of grid){
    const label = extractRowLabel(row);
    if(label && keywords.some(kw=>label.includes(kw))) return label;
  }
  return null;
}
function openRawMappingModal(sheetType){
  const textareaId = sheetType==='pl' ? 'rawPlInput' : 'rawBsInput';
  const raw = document.getElementById(textareaId).value.trim();
  if(!raw) return showToast('اول متن رو پیست کن');
  const activeStock = state.stocks[activeSymbol];
  const endMonth = activeStock ? stockFYEndMonth(activeStock) : 12;
  let grid = parseRawGrid(raw);
  let dateCols = detectDateColumns(grid, endMonth);
  // اگه توی جهت عادی (ردیف=قلم مالی، ستون=تاریخ) چیزی پیدا نشد، شاید کاربر برعکس پیست کرده — جدول رو می‌چرخونیم و دوباره امتحان می‌کنیم
  if(!Object.keys(dateCols).length){
    const transposed = transposeGrid(grid);
    const transposedCols = detectDateColumns(transposed, endMonth);
    if(Object.keys(transposedCols).length){
      grid = transposed;
      dateCols = transposedCols;
      showToast('جهت جدول به‌صورت خودکار تشخیص داده شد (ردیف/ستون جابه‌جا بود)');
    }
  }
  if(!Object.keys(dateCols).length) return showToast('هیچ ستون تاریخی پیدا نشد (مثلاً ۱۴۰۳/۰۳/۳۱ یا «۳ ماهه ۱۴۰۳»)');

  const labels = [...new Set(grid.map(extractRowLabel).filter(Boolean))];
  const savedMapping = getRawMapping()[sheetType] || {};
  const fieldRows = RAW_SHEET_FIELDS[sheetType].map(f=>{
    const guess = savedMapping[f.key] || guessRowForField(grid, f.key);
    const opts = labels.map(l=>`<option value="${l}" ${l===guess?'selected':''}>${l}</option>`).join('');
    return `<div class="field" style="margin-bottom:9px">
      <label>${f.label}</label>
      <select data-rawfieldkey="${f.key}">${`<option value="">— انتخاب نشده —</option>`+opts}</select>
    </div>`;
  }).join('');
  const periodsPreview = Object.values(dateCols).map(d=>`${toFa(d.months)}م ${toFa(d.fiscalYear)}`).join('، ');

  openModal(`
    <h3 style="margin-bottom:4px">نگاشت ردیف‌های ${sheetType==='pl'?'صورت سود و زیان':'ترازنامه'}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px">${toFa(Object.keys(dateCols).length)} دوره شناسایی شد: ${periodsPreview}</div>
    <div style="max-height:280px; overflow-y:auto; margin-bottom:12px">${fieldRows}</div>
    <div class="row" style="justify-content:flex-end; margin-top:10px">
      <button class="btn secondary" id="cancelModalBtn">انصراف</button>
      <button class="btn tan" id="confirmRawImportBtn">ذخیره نگاشت و وارد کردن</button>
    </div>
  `);
  document.getElementById('cancelModalBtn').onclick = closeModal;
  document.getElementById('confirmRawImportBtn').onclick = ()=>runRawImport(sheetType, grid, dateCols);
}
function runRawImport(sheetType, grid, dateCols){
  const stock = state.stocks[activeSymbol];
  if(!stock) return showToast('اول یک سهم انتخاب کن');
  const mapping = {};
  document.querySelectorAll('[data-rawfieldkey]').forEach(sel=>{
    mapping[sel.dataset.rawfieldkey] = sel.value || null;
  });
  getRawMapping()[sheetType] = mapping; // ذخیره‌ی دائمی نگاشت برای استفاده‌ی مجدد روی هر سهم دیگه

  // برای هر قلم مالی نگاشته‌شده، مقدار هر ستون تاریخی رو پیدا کن
  const fieldValuesByCol = {}; // {colIdx: {fieldKey: value}}
  Object.entries(mapping).forEach(([fieldKey, label])=>{
    if(!label) return;
    const row = grid.find(r=>extractRowLabel(r)===label);
    if(!row) return;
    Object.keys(dateCols).forEach(colIdx=>{
      const val = parseFloatSafeExcelCurrency(row[colIdx]);
      fieldValuesByCol[colIdx] = fieldValuesByCol[colIdx] || {};
      fieldValuesByCol[colIdx][fieldKey] = val;
    });
  });

  stock.periods = stock.periods || [];
  let count = 0;
  Object.entries(dateCols).forEach(([colIdx, d])=>{
    const values = fieldValuesByCol[colIdx];
    if(!values) return;
    let entry = stock.periods.find(p=>p.fiscalYear===d.fiscalYear && p.months===d.months);
    if(!entry){
      entry = {id: uid(), fiscalYear: d.fiscalYear, months: d.months};
      stock.periods.push(entry);
    }
    Object.assign(entry, values); // فقط قلم‌های نگاشته‌شده رو به‌روزرسانی می‌کنه، بقیه‌ی فیلدهای دوره (از منبع دیگه) دست‌نخورده می‌مونن
    count++;
  });

  stock.rawSheets = stock.rawSheets || {};
  stock.rawSheets[sheetType] = {raw: document.getElementById(sheetType==='pl'?'rawPlInput':'rawBsInput').value};

  saveState(); closeModal();
  showToast(`${toFa(count)} دوره از برگه خام به‌روزرسانی شد`);
  renderAll();
}

/* ========================= اتصال هندلرها ========================= */
function attachHandlers(){
  // انتخابگر سهم (نوار کناری + نوار بالای صفحه) — هم با کلیک از لیست انتخاب می‌شه، هم با تایپ سرچ می‌شه
  wireSearchableStockCombo('activeStockSelect', 'activeStockDropdown');
  wireSearchableStockCombo('pageStockSwitcher', 'pageStockDropdown');
  const quickSaveBtn = document.getElementById('quickSaveBtn');
  if(quickSaveBtn) quickSaveBtn.onclick = ()=>{
    const stock = state.stocks[activeSymbol];
    if(!stock) return;
    stock.manual = stock.manual || {};
    const mcEl = document.getElementById('quickMarketCap');
    const prEl = document.getElementById('quickCurrentPrice');
    const mc = mcEl.value===''? null : Number(mcEl.value);
    const pr = prEl.value===''? null : Number(prEl.value);
    stock.manual.marketCap = mc;
    stock.manual.marketCapUpdatedAt = Date.now();
    stock.manual.currentPrice = pr;
    // اگه تعداد سهام از قبل ثبت شده و اینجا فقط ارزش بازار رو دادی، قیمت رو از روش محاسبه کن
    if(pr==null && mc!=null && stock.manual.sharesOutstanding){
      stock.manual.currentPrice = Math.round((mc*1e9)/stock.manual.sharesOutstanding);
    }
    // اگه تعداد سهام از قبل ثبت شده بود و اینجا قیمت رو صریحاً عوض کردی، تعداد سهام رو با ارزش بازار جدید هماهنگ کن
    else if(pr!=null && mc!=null && stock.manual.sharesOutstanding){
      stock.manual.sharesOutstanding = Math.round((mc*1e9)/pr);
    }
    saveState(); showToast('ارزش بازار و قیمت روز به‌روزرسانی شد'); renderAll();
  };

  // ستون‌های «تعداد» و «قیمت سربه‌سر» قابل‌ویرایش توی جدول سبد سرمایه‌گذاری — دیگه لازم نیست برای این دو مقدار
  // روی «ویرایش» کلیک کنی و فرم بالای صفحه رو باز کنی؛ مستقیم توی همون سطر تغییرشون بده
  document.querySelectorAll('.portfolio-qty-input').forEach(input=>{
    input.onchange = ()=>{
      const h = (state.portfolio||[]).find(x=>x.id===input.dataset.holdingId);
      if(!h) return;
      if(input.value===''){ showToast('تعداد سهام نمی‌تونه خالی باشه'); input.value = h.quantity; return; }
      h.quantity = Number(input.value);
      saveState(); showToast('تعداد سهام به‌روزرسانی شد'); renderAll();
    };
  });
  document.querySelectorAll('.portfolio-avgprice-input').forEach(input=>{
    input.onchange = ()=>{
      const h = (state.portfolio||[]).find(x=>x.id===input.dataset.holdingId);
      if(!h) return;
      if(input.value===''){ showToast('قیمت سربه‌سر نمی‌تونه خالی باشه'); input.value = h.avgBuyPrice; return; }
      h.avgBuyPrice = Number(input.value);
      saveState(); showToast('قیمت سربه‌سر به‌روزرسانی شد'); renderAll();
    };
  });

  // ستون «ارزش بازار» قابل‌ویرایش توی جدول سبد سرمایه‌گذاری — تغییرش همون فیلد مشترک stock.manual.marketCap رو
  // به‌روز می‌کنه، پس همه‌جای برنامه (نمای کلی، گیج‌ها، مقایسه صنعت، جعبه به‌روزرسانی سریع) هم‌زمان هماهنگ می‌مونن
  document.querySelectorAll('.portfolio-marketcap-input').forEach(input=>{
    input.onchange = ()=>{
      const symbol = input.dataset.symbol;
      const stock = state.stocks[symbol];
      if(!stock) return;
      stock.manual = stock.manual || {};
      const newMarketCap = input.value===''? null : Number(input.value);
      stock.manual.marketCap = newMarketCap;
      stock.manual.marketCapUpdatedAt = Date.now();
      // اگه تعداد سهام این شرکت قبلاً ثبت شده، قیمت روز رو با ارزش بازار جدید هماهنگ کن
      if(newMarketCap!=null && stock.manual.sharesOutstanding){
        stock.manual.currentPrice = Math.round((newMarketCap*1e9)/stock.manual.sharesOutstanding);
      }
      saveState(); showToast(`ارزش بازار ${symbol} به‌روزرسانی شد`); renderAll();
    };
  });

  // پنل هلدینگ/شرکت سرمایه‌گذاری: ذخیره ارزش بازار + ارزش روز/بهای تمام‌شده پرتفوی (برای محاسبه NAV)
  const saveHoldingInputsBtn = document.getElementById('saveHoldingInputsBtn');
  if(saveHoldingInputsBtn) saveHoldingInputsBtn.onclick = ()=>{
    const stock = state.stocks[activeSymbol];
    if(!stock) return;
    stock.manual = stock.manual || {};
    stock.manual.marketCap = numOrNullField('holdingMarketCapInput');
    stock.manual.marketCapUpdatedAt = Date.now();
    stock.manual.portfolioMarketValue = numOrNullField('holdingPortfolioMarketInput');
    stock.manual.portfolioBookValue = numOrNullField('holdingPortfolioBookInput');
    saveState(); showToast('اطلاعات هلدینگ ذخیره شد'); renderAll();
  };
  // ثبت/به‌روزرسانی حقوق مالکانه (فرم ساده‌شده‌ی هلدینگ)
  const saveHoldingEquityBtn = document.getElementById('saveHoldingEquityBtn');
  if(saveHoldingEquityBtn) saveHoldingEquityBtn.onclick = ()=>{
    const stock = state.stocks[activeSymbol];
    if(!stock) return;
    const fiscalYear = parseIntSafe(document.getElementById('holdingEqYear').value);
    const months = parseIntSafe(document.getElementById('holdingEqMonths').value);
    const equity = numOrNullField('holdingEqValue');
    if(!fiscalYear || !months) return showToast('سال مالی و دوره را وارد کن');
    if(equity==null) return showToast('مقدار حقوق مالکانه را وارد کن');
    stock.periods = stock.periods || [];
    let p = stock.periods.find(x=>x.fiscalYear===fiscalYear && x.months===months);
    if(!p){ p = {id:uid(), fiscalYear, months}; stock.periods.push(p); }
    p.equity = equity;
    saveState(); showToast('حقوق مالکانه ثبت شد'); renderAll();
  };
  document.querySelectorAll('[data-delholdingequity]').forEach(el=>el.onclick=()=>{
    const stock = state.stocks[activeSymbol];
    if(!stock) return;
    stock.periods = (stock.periods||[]).filter(p=>p.id!==el.dataset.delholdingequity);
    saveState(); renderAll();
  });
  const goToSubsidiariesBtn = document.getElementById('goToSubsidiariesBtn');
  if(goToSubsidiariesBtn) goToSubsidiariesBtn.onclick = ()=>{
    activeTab = 'dashboard';
    dashSubtab = 'subsidiaries';
    renderAll();
  };
  // افزودن سهم غیربورسی زیرمجموعه
  const addUnlistedBtn = document.getElementById('addUnlistedBtn');
  if(addUnlistedBtn) addUnlistedBtn.onclick = ()=>{
    const stock = state.stocks[activeSymbol];
    if(!stock) return;
    const name = document.getElementById('unlistedNameInput').value.trim();
    const percent = parseFloat(document.getElementById('unlistedPercentInput').value);
    const estimatedValue = numOrNullField('unlistedValueInput');
    if(!name) return showToast('نام شرکت غیربورسی را وارد کن');
    if(isNaN(percent) || percent<=0 || percent>100) return showToast('درصد باید بین ۰ تا ۱۰۰ باشه');
    stock.unlistedHoldings = stock.unlistedHoldings || [];
    stock.unlistedHoldings.push({id:uid(), name, percent, estimatedValue});
    saveState(); showToast('اضافه شد'); renderAll();
  };
  document.querySelectorAll('[data-delunlisted]').forEach(el=>el.onclick=()=>{
    const stock = state.stocks[activeSymbol];
    if(!stock) return;
    stock.unlistedHoldings = (stock.unlistedHoldings||[]).filter(u=>u.id!==el.dataset.delunlisted);
    saveState(); renderAll();
  });
  // افزودن سهم بورسی زیرمجموعه از خودِ تب ورود اطلاعات هلدینگ
  const addHoldingSubBtn = document.getElementById('addHoldingSubBtn');
  if(addHoldingSubBtn) addHoldingSubBtn.onclick = ()=>{
    const stock = state.stocks[activeSymbol];
    if(!stock) return;
    const subSymbol = document.getElementById('holdingSubSymbolSelect').value;
    const percent = parseFloat(document.getElementById('holdingSubPercentInput').value);
    if(!subSymbol) return showToast('یه سهم انتخاب کن');
    if(isNaN(percent) || percent<=0 || percent>100) return showToast('درصد باید بین ۰ تا ۱۰۰ باشه');
    stock.subsidiaries = stock.subsidiaries || [];
    stock.subsidiaries = stock.subsidiaries.filter(s=>s.symbol!==subSymbol);
    stock.subsidiaries.push({symbol:subSymbol, percent});

/* ========================= همگام‌سازی با گیت‌هاب ========================= */
// این تنظیمات (خصوصاً توکن) عمداً جدا از state ذخیره می‌شه تا هیچ‌وقت توی فایل‌های بک‌آپ خروجی (دانلود/ایمیل) قرار نگیره
const GH_STORAGE_KEY = 'fundamental_analyzer_gh_sync_v1';
function getGhConfig(){
  try{ return JSON.parse(localStorage.getItem(GH_STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveGhConfig(cfg){
  try{ localStorage.setItem(GH_STORAGE_KEY, JSON.stringify(cfg)); }catch(e){}
}
function ghHeaders(token){
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }
async function ghApi(cfg, path, opts){
  const res = await fetch(`https://api.github.com${path}`, Object.assign({}, opts, {
    headers: Object.assign({'Content-Type':'application/json'}, ghHeaders(cfg.token), (opts&&opts.headers)||{})
  }));
  if(!res.ok && res.status!==404){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message || ('خطای گیت‌هاب: ' + res.status));
  }
  return res;
}
// روش ساده (برای اولین بار، وقتی هنوز تاریخچه‌ای برای amend کردن نیست)
async function ghSimplePut(cfg, path, branch, content, message){
  const getRes = await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`, {headers: ghHeaders(cfg.token)});
  let sha = null;
  if(getRes.status===200) sha = (await getRes.json()).sha;
  const body = { message, content: utf8ToBase64(content), branch };
  if(sha) body.sha = sha;
  const putRes = await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(path)}`, { method:'PUT', body: JSON.stringify(body) });
  return (await putRes.json()).commit.sha;
}
// همگام‌سازی با «جایگزینی کامیت قبلی» به‌جای اضافه کردن کامیت جدید — فقط وقتی مطمئنیم از آخرین باری که خودمون sync کردیم چیز دیگه‌ای عوض نشده
async function ghPush(){
  const cfg = getGhConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return showToast('اول تنظیمات گیت‌هاب رو کامل کن و ذخیره کن');
  const path = cfg.path || 'data/backup.json';
  const branch = cfg.branch || 'main';
  const message = 'بروزرسانی بک‌آپ از برنامه تحلیل بنیادی - ' + new Date().toLocaleString('fa-IR');
  const content = JSON.stringify(state, null, 2);
  showToast('در حال ارسال به گیت‌هاب...');
  try{
    const refRes = await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/git/ref/heads/${encodeURIComponent(branch)}`);
    if(refRes.status===404){
      // شاخه/مخزن هنوز کامیتی نداره؛ با روش ساده اولین کامیت رو می‌سازیم
      const newSha = await ghSimplePut(cfg, path, branch, content, message);
      cfg.lastCommitSha = newSha;
    } else {
      const tipSha = (await refRes.json()).object.sha;
      const canAmend = cfg.lastCommitSha && cfg.lastCommitSha === tipSha;
      const tipCommit = await (await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/git/commits/${tipSha}`)).json();
      let parents, baseTreeSha, didAmend = false;
      if(canAmend){
        const parentSha = tipCommit.parents && tipCommit.parents[0] ? tipCommit.parents[0].sha : null;
        if(parentSha){
          parents = [parentSha];
          baseTreeSha = (await (await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/git/commits/${parentSha}`)).json()).tree.sha;
          didAmend = true;
        } else {
          // کامیت قبلی‌مون همون اولین کامیت مخزن بوده؛ برای امنیت (که فایل‌های دیگه گم نشن) amend نمی‌کنیم
          parents = [tipSha];
          baseTreeSha = tipCommit.tree.sha;
        }
      } else {
        parents = [tipSha];
        baseTreeSha = tipCommit.tree.sha;
      }
      const blobSha = (await (await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/git/blobs`, {
        method:'POST', body: JSON.stringify({content: utf8ToBase64(content), encoding:'base64'})
      })).json()).sha;
      const treeSha = (await (await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/git/trees`, {
        method:'POST', body: JSON.stringify({base_tree: baseTreeSha, tree:[{path, mode:'100644', type:'blob', sha: blobSha}]})
      })).json()).sha;
      const newCommit = await (await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/git/commits`, {
        method:'POST', body: JSON.stringify({message, tree: treeSha, parents})
      })).json();
      await ghApi(cfg, `/repos/${cfg.owner}/${cfg.repo}/git/refs/heads/${encodeURIComponent(branch)}`, {
        method:'PATCH', body: JSON.stringify({sha: newCommit.sha, force: didAmend})
      });
      cfg.lastCommitSha = newCommit.sha;
    }
    cfg.lastSync = new Date().toISOString();
    saveGhConfig(cfg);
    showToast('با موفقیت توی گیت‌هاب ذخیره شد ✅');
    renderAll();
  }catch(e){
    showToast('خطا در ارسال به گیت‌هاب: ' + e.message);
  }
}

// (ارزش بازار علاوه بر تبدیل ریال‌به‌تومان، به «میلیارد تومان» هم تبدیل می‌شه که واحد فیلد marketCap توی برنامه‌ست)
async function updateSymbolsFromBrsApi(){
  const cfg = getBrsApiConfig();
  const apiKey = (cfg.apiKey!=null && cfg.apiKey!=='') ? cfg.apiKey : 'B7L8LXEHpBb2TfgAxwRLRk7v3yxDRRb6';
  if(!apiKey) return showToast('اول کلید API رو وارد و ذخیره کن');
  showToast('در حال دریافت اطلاعات نمادها از BrsApi.ir...');
  try{
    const res = await fetch(`https://api.brsapi.ir/Tsetmc/AllSymbols.php?key=${encodeURIComponent(apiKey)}&type=1`);
    if(!res.ok) throw new Error('خطای سرور BrsApi: ' + res.status);
    const list = await res.json();
    if(!Array.isArray(list)) throw new Error('پاسخ نامعتبر از BrsApi دریافت شد');
    const bySymbol = {};
    list.forEach(item=>{ if(item && item.l18) bySymbol[item.l18] = item; });

    let updatedStocks = 0, updatedFunds = 0;
    const notFound = [];
    Object.keys(state.stocks).forEach(sym=>{
      const item = bySymbol[sym];
      if(!item){ notFound.push(sym); return; }
      const stock = state.stocks[sym];
      stock.manual = stock.manual || {};
      if(item.pc!=null) stock.manual.currentPrice = item.pc/10; // ریال -> تومان
      if(item.mv!=null) stock.manual.marketCap = item.mv/1e10; // ریال -> میلیارد تومان
      if(item.z!=null) stock.manual.sharesOutstanding = item.z; // تعداد کل سهام شرکت
      stock.manual.marketCapUpdatedAt = Date.now(); // تا ستون «آخرین به‌روزرسانی» توی سبد سرمایه‌گذاری هم درست بشه
      updatedStocks++;
    });
    const funds = getGoldFunds();
    Object.keys(funds).forEach(id=>{
      const fund = funds[id];
      const item = bySymbol[fund.symbol];
      if(!item) return;
      fund.manual = fund.manual || {};
      if(item.pc!=null) fund.manual.marketPrice = item.pc/10; // ریال -> تومان
      updatedFunds++;
    });

    cfg.apiKey = apiKey;
    cfg.lastUpdate = new Date().toISOString();
    saveBrsApiConfig(cfg);
    saveState();
    let msg = `${toFa(updatedStocks)} سهم` + (updatedFunds ? ` و ${toFa(updatedFunds)} صندوق` : '') + ' به‌روز شد ✅';
    if(notFound.length) msg += ` — پیدا نشد: ${notFound.join('، ')}`;
    showToast(msg);
    renderAll();
  }catch(e){
    showToast('خطا در دریافت اطلاعات از BrsApi: ' + e.message + ' (اگه پیام «Failed to fetch» می‌بینی، احتمالاً محدودیت CORS مرورگره)');
  }
}

async function buildBackupFile(encrypt){

// combobox سهم: هم با کلیک روی فیلد کل لیست باز می‌شه (مثل select قدیمی)، هم با تایپ فیلتر می‌شه
function wireSearchableStockCombo(inputId, dropdownId){
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if(!input || !dropdown) return;
  const symbols = Object.keys(state.stocks);
  function displayValue(sym){ return sym ? `${sym} — ${state.stocks[sym].name||''}` : ''; }
  function renderOptions(filterText){
    const q = (filterText||'').trim().toLowerCase();
    const filtered = symbols.filter(s=>{
      if(!q) return true;
      const name = (state.stocks[s].name||'').toLowerCase();
      return s.toLowerCase().includes(q) || name.includes(q);
    });
    dropdown.innerHTML = filtered.length
      ? filtered.map(s=>`<div class="combo-item${s===activeSymbol?' active':''}" data-symbol="${s}">${displayValue(s)}</div>`).join('')
      : `<div class="combo-item empty">موردی پیدا نشد</div>`;
    dropdown.querySelectorAll('.combo-item[data-symbol]').forEach(el=>{
      el.onmousedown = (e)=>{
        e.preventDefault(); // جلوگیری از blur قبل از ثبت کلیک
        const sym = el.dataset.symbol;
        dropdown.classList.remove('open');
        if(sym && sym!==activeSymbol){ activeSymbol = sym; renderAll(); }
        else { input.value = displayValue(activeSymbol); }
      };
    });
  }
  function openDropdown(){
    // اگه فیلد الان مقدار انتخاب‌شده‌ی فعلی رو نشون می‌ده (نه یه چیز نصفه‌تایپ‌شده)، کل لیست رو نشون بده
    const isShowingCurrentSelection = input.value === displayValue(activeSymbol);
    renderOptions(isShowingCurrentSelection ? '' : input.value);
    dropdown.classList.add('open');
  }
  input.onfocus = openDropdown;
  input.onclick = openDropdown;
  input.oninput = ()=>{ renderOptions(input.value); dropdown.classList.add('open'); };
  input.onblur = ()=> setTimeout(()=>{
    dropdown.classList.remove('open');
    // اگه چیزی که تایپ شده با هیچ سهمی مطابقت نداشت، برگردون به مقدار انتخاب فعلی
    if(input.value !== displayValue(activeSymbol)){
      const q = input.value.trim().toLowerCase();
      const match = symbols.find(s=> s.toLowerCase()===q || displayValue(s).toLowerCase()===q);
      input.value = match ? displayValue(match) : displayValue(activeSymbol);
      if(match && match!==activeSymbol){ activeSymbol = match; renderAll(); }
    }
  }, 150);
  input.onkeydown = (e)=>{ if(e.key==='Escape'){ dropdown.classList.remove('open'); input.blur(); } };
}

// ================== مرتب‌سازی و جستجوی جدول‌ها (مثل اکسل) ==================
const tableSortState = {}; // {tableId: {col, dir}}
function enhanceSortableTables(){
  document.querySelectorAll('table.sortable-table').forEach(table=>{
    if(!table.id) return;
    const thead = table.querySelector('thead');
    if(!thead) return;
    const ths = thead.querySelectorAll('th');
    const st = tableSortState[table.id];
    ths.forEach((th, idx)=>{
      if(th.dataset.origText==null) th.dataset.origText = th.textContent;
      th.textContent = th.dataset.origText + (st && st.col===idx ? (st.dir==='asc'?' ▲':' ▼') : '');
      th.style.cursor = 'pointer';
      th.style.userSelect = 'none';
      th.onclick = ()=> sortTableByColumn(table.id, idx);
    });
    if(st) applyTableSort(table.id, st.col, st.dir);
  });
}
function applyTableSort(tableId, colIdx, dir){
  const table = document.getElementById(tableId);
  if(!table) return;
  const tbody = table.querySelector('tbody');
  if(!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const getCellText = (row)=>{ const cell = row.children[colIdx]; return getCellSearchText(cell).trim(); };
  const cleanNum = (t)=> parseFlexibleNumber(toEnDigits(t).replace(/[٪%,،]/g,''));
  const allNumeric = rows.length>0 && rows.every(r=>{ const t=getCellText(r); return t===''||t==='—'|| cleanNum(t)!=null; });
  rows.sort((a,b)=>{
    const va = getCellText(a), vb = getCellText(b);
    let cmp;
    if(allNumeric){
      const na = cleanNum(va), nb = cleanNum(vb);
      cmp = (na==null? -Infinity : na) - (nb==null? -Infinity : nb);
    } else {
      cmp = va.localeCompare(vb, 'fa');
    }
    return dir==='asc' ? cmp : -cmp;
  });
  rows.forEach(r=>tbody.appendChild(r));
}
function sortTableByColumn(tableId, colIdx){
  const prev = tableSortState[tableId];
  const dir = (prev && prev.col===colIdx && prev.dir==='asc') ? 'desc' : 'asc';
  tableSortState[tableId] = {col:colIdx, dir};
  applyTableSort(tableId, colIdx, dir);
  enhanceSortableTables(); // برای به‌روزرسانی نشانه‌ی فلش روی سرستون
}
// جست‌وجو + فیلتر ستونی جدول‌ها: هر جدول یه وضعیت مشترک داره {search, cols:{colIdx:value}}
// و applyRowVisibility هر دو رو با هم (AND) اعمال می‌کنه تا با جعبه‌ی جست‌وجوی کلی تداخل نداشته باشه
const tableFilterState = {}; // {tableId: {search, cols:{colIdx:value}}}
// متن قابل‌جست‌وجوی یه سلول: اگه سلول خودش input/select داره (مثل ستون‌های قابل‌ویرایش توی جدول)، مقدار همون
// input رو برمی‌گردونه؛ وگرنه متن معمولی سلول. چون textContent روی سلولی که فقط یه <input> داخلشه خالیه.
function getCellSearchText(cell){
  if(!cell) return '';
  const field = cell.querySelector('input,select');
  if(field) return String(field.value ?? '');
  return cell.textContent || '';
}
function getRowSearchText(row){
  return Array.from(row.children).map(getCellSearchText).join(' ');
}
function applyRowVisibility(tableId){
  const table = document.getElementById(tableId);
  if(!table) return;
  const tbody = table.querySelector('tbody');
  if(!tbody) return;
  const st = tableFilterState[tableId] || {};
  const search = (st.search||'').trim().toLowerCase();
  const cols = st.cols || {};
  const activeColIdx = Object.keys(cols).filter(k=> (cols[k]||'').trim()!=='');
  Array.from(tbody.querySelectorAll('tr')).forEach(row=>{
    // ردیف‌های پیام «هنوز چیزی ثبت نشده» (یک سلول با colspan) رو فیلتر نکن
    if(row.children.length===1 && row.children[0].hasAttribute('colspan')) return;
    let visible = true;
    if(search && !getRowSearchText(row).toLowerCase().includes(search)) visible = false;
    if(visible){
      for(const idxStr of activeColIdx){
        const idx = Number(idxStr);
        const filterVal = cols[idx].trim().toLowerCase();
        const cell = row.children[idx];
        const cellText = getCellSearchText(cell).trim().toLowerCase();
        if(!cellText.includes(filterVal)){ visible = false; break; }
      }
    }
    row.style.display = visible ? '' : 'none';
  });
}
// جست‌وجوی متنی کلی (روی کل متن ردیف) — می‌تونه هم‌زمان با فیلترهای ستونی زیر هر سرستون فعال باشه
function wireTableSearch(inputId, tableIds){
  const input = document.getElementById(inputId);
  if(!input) return;
  const ids = tableIds || Array.from(document.querySelectorAll('table.sortable-table')).map(t=>t.id).filter(Boolean);
  ids.forEach(tid=>{ tableFilterState[tid] = tableFilterState[tid] || {cols:{}}; });
  input.value = (tableFilterState[ids[0]] && tableFilterState[ids[0]].search) || '';
  input.oninput = ()=>{
    ids.forEach(tid=>{
      tableFilterState[tid] = tableFilterState[tid] || {cols:{}};
      tableFilterState[tid].search = input.value;
      applyRowVisibility(tid);
    });
  };
}
// فیلتر ستونی: زیر هر سرستون (به‌جز ستون‌های بدون عنوان مثل ستون اقدامات) یه کادر ورودی اضافه می‌کنه؛
// نوشتن توی هرکدوم، ردیف‌هایی که همون ستون شامل اون مقدار نباشه رو مخفی می‌کنه (قابل ترکیب روی چند ستون هم‌زمان)
function wireColumnFilters(tableId){
  const table = document.getElementById(tableId);
  if(!table || table.dataset.filterable!=='true') return;
  const tbody = table.querySelector('tbody');
  const dataRows = tbody ? Array.from(tbody.querySelectorAll('tr')).filter(r=> !(r.children.length===1 && r.children[0].hasAttribute('colspan'))) : [];
  if(!dataRows.length) return; // جدول هنوز داده‌ای نداره؛ نیازی به ردیف فیلتر نیست
  const thead = table.querySelector('thead');
  if(!thead) return;
  const headerRow = thead.querySelector('tr');
  if(!headerRow) return;
  const ths = Array.from(headerRow.querySelectorAll('th'));
  tableFilterState[tableId] = tableFilterState[tableId] || {cols:{}};
  let filterRow = thead.querySelector('tr.col-filter-row');
  if(!filterRow){
    filterRow = document.createElement('tr');
    filterRow.className = 'col-filter-row';
    ths.forEach((th, idx)=>{
      const cell = document.createElement('th');
      const label = (th.dataset.origText!=null ? th.dataset.origText : th.textContent).trim();
      if(label){
        cell.innerHTML = `<input type="text" class="col-filter-input" data-col-idx="${idx}" placeholder="${label}">`;
      }
      filterRow.appendChild(cell);
    });
    headerRow.after(filterRow);
  }
  filterRow.querySelectorAll('.col-filter-input').forEach(input=>{
    const idx = Number(input.dataset.colIdx);
    const st = tableFilterState[tableId];
    input.value = (st.cols && st.cols[idx]) || '';
    input.oninput = ()=>{
      st.cols = st.cols || {};
      st.cols[idx] = input.value;
      applyRowVisibility(tableId);
    };
  });
}
function clearTableFilters(tableId, searchInputId){
  tableFilterState[tableId] = {cols:{}, search:''};
  const searchInput = searchInputId ? document.getElementById(searchInputId) : null;
  if(searchInput) searchInput.value = '';
  const table = document.getElementById(tableId);
  if(table){
    table.querySelectorAll('.col-filter-input').forEach(inp=> inp.value='');
  }
  applyRowVisibility(tableId);
}
// وقتی یکی از این سه فیلد (ارزش بازار / تعداد سهام / قیمت روز) تغییر کنه، با داشتن ارزش بازار،
// هرکدوم از دوتای دیگه که خالی مونده باشه از روی اون یکی خودکار محاسبه و پر می‌شه.
// قیمت روز هر سهم = (ارزش بازار به میلیارد تومان × ۱٬۰۰۰٬۰۰۰٬۰۰۰) ÷ تعداد سهام
function autoDeriveSharePriceFields(){
  const mcEl = document.getElementById('manualMarketCap');
  const shEl = document.getElementById('manualSharesOutstanding');
  const prEl = document.getElementById('manualCurrentPrice');
  if(!mcEl || !shEl || !prEl) return;
  const marketCap = mcEl.value===''? null : Number(mcEl.value);
  const shares = shEl.value===''? null : Number(shEl.value);
  const price = prEl.value===''? null : Number(prEl.value);
  if(!marketCap) return;
  const marketCapToman = marketCap * 1e9; // میلیارد تومان -> تومان
  if(shares!=null && shares>0 && price==null){
    prEl.value = Math.round(marketCapToman/shares);
  } else if(price!=null && price>0 && shares==null){
    shEl.value = Math.round(marketCapToman/price);
  }
}

document.getElementById('importFileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      let finalState = parsed;
      if(parsed && parsed.encrypted){
        const pw = prompt('این فایل رمزگذاری‌شده. پسورد رو وارد کن:');
        if(!pw) return;
        try{
          const decryptedText = await decryptBackupText(pw, parsed);
          finalState = JSON.parse(decryptedText);
        }catch(err){ showToast('پسورد اشتباهه یا فایل خراب شده'); return; }
      }
      if(!finalState.stocks) throw new Error('invalid');
      state = finalState;
      activeSymbol = Object.keys(state.stocks)[0]||null;
      saveState(); showToast('بازیابی با موفقیت انجام شد'); renderAll();
    }catch(err){ showToast('فایل نامعتبر است'); }
  };
  reader.readAsText(file);
  e.target.value='';
});

// روی گوشی، چرخش صفحه (پرتره↔افقی) می‌تونه عرض رو از مرز موبایل (۶۴۰px) رد کنه؛ چون تنظیمات فونت/لجند
// نمودارها موقع ساختشون تعیین می‌شه، بعد از تغییر اندازه‌ی صفحه دوباره رندر می‌کنیم تا هماهنگ بمونن
// نکته‌ی مهم: باز/بسته‌شدن کیبورد مجازی گوشی هم رویداد resize رو صدا می‌زنه (چون فقط ارتفاع صفحه عوض می‌شه)،
// و اگه دقیقاً همون لحظه رندر مجدد کامل انجام بشه، فیلدی که کاربر داره توش تایپ می‌کنه از بین می‌ره و از فوکوس خارج می‌شه (کیبورد بسته می‌شه).
// برای جلوگیری از این مشکل: ۱) وقتی یه input/textarea/select فوکوس داره، رندر مجدد رو انجام نمی‌دیم؛
// ۲) فقط وقتی «عرض» صفحه واقعاً عوض شده باشه (نه صرفاً ارتفاع، که علامت کیبورده) رندر مجدد می‌کنیم.
let resizeRerenderTimer = null;
let lastResizeWidth = window.innerWidth;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeRerenderTimer);
  resizeRerenderTimer = setTimeout(()=>{
    const active = document.activeElement;
    const isEditing = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
    const widthChanged = window.innerWidth !== lastResizeWidth;
    lastResizeWidth = window.innerWidth;
    if(isEditing || !widthChanged) return;
    renderAll();
  }, 300);
});

renderAll();
tryAutoReconnectLocalFile();
</script>
<script>
// یه service worker قدیمی (sw.js) قبلاً اینجا ثبت می‌شد که باعث می‌شد بعد از تغییر اسم فایل،
// مرورگر نسخه‌ی کش‌شده‌ی قدیمی/خراب رو به‌جای صفحه‌ی واقعی نشون بده (همون صفحه‌ی سفید).
// این بخش الان هر service worker و کش قبلی مربوط به این آدرس رو پاک می‌کنه تا مشکل خودش حل بشه،
// و دیگه چیزی رو دوباره ثبت نمی‌کنه.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(reg=> reg.unregister());
  }).catch(()=>{});
}
if(window.caches && caches.keys){
  caches.keys().then(names=>{
    names.forEach(name=> caches.delete(name));
  }).catch(()=>{});
}
</script>
